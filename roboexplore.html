  <script>
/* ==== src/systems/echo.js ==== */
/* RoboExplore — Echo-Sight system (the signature mechanic).
 *
 * Lighting model (design bible §3): the world is dark. A tile's brightness is
 *   max( dynamicLight, ghostFloor(if ever seen), passiveLight(distance) ).
 * A pulse washes tiles to full brightness as its front crosses them; tiles hold
 * full for echoTileHold, then decay exponentially (tau = echoTileFadeTau) down
 * to a permanent dim "ghost floor" so you remember the map's shape, not its
 * contents. Weapon light does a soft, no-hold wash.
 *
 * Also hosts Echo-Return pings (Twist B): colored blips that travel back to the
 * player when a pulse crosses a point of interest, giving directional intel that
 * outlives the visual reveal.
 */
(function (RE) {
  'use strict';
  const M = RE.M;

  const Echo = {
    map: null, cfg: null,
    W: 0, H: 0, T: 28,
    light: null,       // Float32 dynamic brightness [0,1]
    holdT: null,       // Float32 remaining full-bright hold time
    seen: null,        // Uint8 ever-washed
    pulses: [],
    pings: [],
    hold: 0.4, tau: 1.4,

    reset(map, cfg) {
      this.map = map; this.cfg = cfg;
      this.W = map.w; this.H = map.h; this.T = map.tile;
      const n = this.W * this.H;
      this.light = new Float32Array(n);
      this.holdT = new Float32Array(n);
      this.seen = new Uint8Array(n);
      this.pulses.length = 0;
      this.pings.length = 0;
      this.hold = cfg.player.echoTileHold;
      this.tau = cfg.player.echoTileFadeTau;
    },

    pulse(x, y, opts) {
      opts = opts || {};
      const p = {
        x, y,
        r: opts.r0 || 4,
        maxR: opts.maxR != null ? opts.maxR : this.cfg.player.echoMaxRadius,
        speed: opts.speed != null ? opts.speed : this.cfg.player.echoSpeed,
        band: opts.band != null ? opts.band : this.cfg.player.echoBandWidth,
        strength: opts.strength != null ? opts.strength : 1,
        prevR: opts.r0 || 4,
        life: 0,
        source: opts.source || 'player',
        id: (Echo._pid = (Echo._pid || 0) + 1),
      };
      this.pulses.push(p);
      return p;
    },
    _pid: 0,

    // Soft wash (weapon light / flora): brighten tiles within radius, no hold.
    washSoft(x, y, radius, level) {
      const { W, H, T, light, seen } = this;
      const r2 = radius * radius;
      const minTx = M.clamp(((x - radius) / T) | 0, 0, W - 1);
      const maxTx = M.clamp(((x + radius) / T) | 0, 0, W - 1);
      const minTy = M.clamp(((y - radius) / T) | 0, 0, H - 1);
      const maxTy = M.clamp(((y + radius) / T) | 0, 0, H - 1);
      for (let ty = minTy; ty <= maxTy; ty++) {
        const cy = (ty + 0.5) * T - y;
        for (let tx = minTx; tx <= maxTx; tx++) {
          const cx = (tx + 0.5) * T - x;
          if (cx * cx + cy * cy > r2) continue;
          const i = ty * W + tx;
          if (light[i] < level) light[i] = level;
          seen[i] = 1;
        }
      }
    },

    spawnPing(x, y, color) {
      // Cap concurrent pings for readability.
      if (this.pings.length > 40) this.pings.shift();
      this.pings.push({ x, y, color, t: 0, life: 0.9, arrived: false });
    },

    update(dt, player) {
      const { W, H, T, light, holdT, seen } = this;
      // 1. Advance pulses, wash swept tiles.
      for (let pi = this.pulses.length - 1; pi >= 0; pi--) {
        const p = this.pulses[pi];
        p.prevR = p.r;
        p.r += p.speed * dt;
        p.life += dt;
        const inner = Math.max(0, p.prevR - p.band);
        const outer = p.r + p.band * 0.5;
        const minTx = M.clamp(((p.x - outer) / T) | 0, 0, W - 1);
        const maxTx = M.clamp(((p.x + outer) / T) | 0, 0, W - 1);
        const minTy = M.clamp(((p.y - outer) / T) | 0, 0, H - 1);
        const maxTy = M.clamp(((p.y + outer) / T) | 0, 0, H - 1);
        const inner2 = inner * inner, outer2 = outer * outer;
        const strength = p.strength * (1 - (p.r / p.maxR) * 0.45);
        for (let ty = minTy; ty <= maxTy; ty++) {
          const cy = (ty + 0.5) * T - p.y;
          for (let tx = minTx; tx <= maxTx; tx++) {
            const cx = (tx + 0.5) * T - p.x;
            const d2 = cx * cx + cy * cy;
            if (d2 < inner2 || d2 > outer2) continue;
            const i = ty * W + tx;
            const s = Math.max(0.3, strength);
            if (s >= light[i]) { light[i] = s; holdT[i] = this.hold; }
            seen[i] = 1;
          }
        }
        if (p.r > p.maxR) this.pulses.splice(pi, 1);
      }

      // 2. Decay: precompute constant factor (dt is fixed).
      const decay = Math.exp(-dt / this.tau);
      const ghost = this.cfg.player.ghostFloor;
      for (let i = 0; i < light.length; i++) {
        if (holdT[i] > 0) { holdT[i] -= dt; continue; }
        let v = light[i];
        if (v > 0) {
          v *= decay;
          if (v < 0.004) v = 0;
          light[i] = v;
        }
      }

      // 3. Pings travel back to the player.
      if (player) {
        for (let i = this.pings.length - 1; i >= 0; i--) {
          const ping = this.pings[i];
          ping.t += dt;
          const dx = player.x - ping.x, dy = player.y - ping.y;
          const d = Math.hypot(dx, dy);
          const step = this.cfg.player.pingSpeed * dt;
          if (d <= step || ping.t > ping.life) { this.pings.splice(i, 1); continue; }
          ping.x += dx / d * step; ping.y += dy / d * step;
        }
      }
    },

    passiveAt(px, py, player) {
      if (!player) return 0;
      const inner = player.lightInner || this.cfg.player.lightInner;
      const outer = player.lightOuter || this.cfg.player.lightOuter;
      const d = M.dist(px, py, player.x, player.y);
      if (d <= inner) return 1;
      if (d >= outer) return 0;
      // smoothstep falloff
      const t = 1 - (d - inner) / (outer - inner);
      return t * t * (3 - 2 * t);
    },

    tileBrightness(tx, ty, player) {
      if (this.cfg.debug && this.cfg.debug.revealAll) return 1;
      const i = ty * this.W + tx;
      let b = this.light[i];
      if (this.seen[i]) { const g = this.cfg.player.ghostFloor; if (g > b) b = g; }
      const px = (tx + 0.5) * this.T, py = (ty + 0.5) * this.T;
      const passive = this.passiveAt(px, py, player);
      if (passive > b) b = passive;
      return b > 1 ? 1 : b;
    },

    // Brightness at an arbitrary world point (entities); includes passive.
    lightAt(px, py, player) {
      if (this.cfg.debug && this.cfg.debug.revealAll) return 1;
      const tx = (px / this.T) | 0, ty = (py / this.T) | 0;
      let b = 0;
      if (tx >= 0 && ty >= 0 && tx < this.W && ty < this.H) b = this.light[ty * this.W + tx];
      const passive = this.passiveAt(px, py, player);
      if (passive > b) b = passive;
      return b > 1 ? 1 : b;
    },

    // The strongest pulse currently sweeping across a point, or null. Used for
    // reveal, marking, aggro (Twist D), and ping spawning.
    pulseSweeping(px, py, radius) {
      radius = radius || 0;
      let best = null;
      for (const p of this.pulses) {
        const d = M.dist(px, py, p.x, p.y);
        const lo = Math.min(p.prevR, p.r) - p.band - radius;
        const hi = Math.max(p.prevR, p.r) + p.band * 0.5 + radius;
        if (d >= lo && d <= hi) { if (!best || p.strength > best.strength) best = p; }
      }
      return best;
    },
  };

  RE.Echo = Echo;
})(window.RE = window.RE || {});
  </script>

  <script>
/* ==== src/ui/hud.js ==== */
/* RoboExplore — heads-up display drawn to the canvas each frame. */
(function (RE) {
  'use strict';
  const M = RE.M;

  const HUD = {
    // Toast messages (log fragments, pickups, tips).
    toasts: [],
    banner: null,

    reset() { this.toasts.length = 0; this.banner = null; },

    toast(text, opts) {
      opts = opts || {};
      this.toasts.push({ text, t: 0, life: opts.life || 3.2, color: opts.color || '#cfe9ff', big: opts.big });
      if (this.toasts.length > 5) this.toasts.shift();
    },

    showBanner(title, subtitle, life) {
      this.banner = { title, subtitle: subtitle || '', t: 0, life: life || 2.6 };
    },

    update(dt) {
      for (let i = this.toasts.length - 1; i >= 0; i--) {
        this.toasts[i].t += dt;
        if (this.toasts[i].t >= this.toasts[i].life) this.toasts.splice(i, 1);
      }
      if (this.banner) { this.banner.t += dt; if (this.banner.t >= this.banner.life) this.banner = null; }
    },

    render(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      const p = game.player;
      if (!p) return;
      ctx.save();

      // Low-energy / low-hull vignette.
      const hullFrac = p.hull / p.hullMax;
      const enFrac = p.energy / p.energyMax;
      if (hullFrac < 0.35 || enFrac < 0.2) {
        const danger = Math.max(1 - hullFrac / 0.35, 0) * 0.5;
        const pulse = 0.5 + 0.5 * Math.sin(game.time * 6);
        const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, `rgba(${hullFrac < 0.35 ? 180 : 40},30,60,${(0.25 + danger) * (0.6 + 0.4 * pulse)})`);
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
      }

      // Overheat vignette + warning (Core Marrow).
      if (p.overheating) {
        const pulse = 0.5 + 0.5 * Math.sin(game.time * 10);
        const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.7);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, `rgba(255,90,20,${0.3 + 0.2 * pulse})`);
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.font = 'bold 15px monospace';
        ctx.fillStyle = `rgba(255,160,90,${0.7 + 0.3 * pulse})`;
        ctx.fillText('OVERHEATING — KEEP MOVING', W / 2, H * 0.22);
      }
      // EM jam warning (Static Vaults).
      if (game.echoDisabled) {
        const flick = Math.random() < 0.5 ? 0.5 : 0.9;
        ctx.textAlign = 'center'; ctx.font = 'bold 15px monospace';
        ctx.fillStyle = `rgba(255,170,60,${flick})`;
        ctx.fillText('◈ SIGNAL JAMMED ◈', W / 2, H * 0.22);
        // faint static specks
        for (let i = 0; i < 30; i++) { ctx.fillStyle = `rgba(200,220,255,${Math.random() * 0.08})`; ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
      }

      // --- Bottom-left status cluster ---
      const bx = 18, by = H - 64;
      // Hull bar
      this._bar(ctx, bx, by, 210, 14, hullFrac, '#ff4d6d', '#ff97ac', 'HULL', Math.ceil(p.hull) + '/' + p.hullMax);
      // Energy bar
      this._bar(ctx, bx, by + 22, 210, 14, enFrac, '#2db6ff', '#9fe4ff', 'ENERGY', Math.ceil(p.energy) + '/' + p.energyMax);

      // Echo cooldown pip
      const echoFrac = 1 - M.clamp(p.echoCd / RE.CFG.player.echoCooldown, 0, 1);
      this._pip(ctx, bx + 232, by + 4, 16, echoFrac, '#8ef', 'E');
      const dashFrac = 1 - M.clamp(p.dashCd / (RE.CFG.player.dashCooldown + p.stats.dashCdAdd), 0, 1);
      this._pip(ctx, bx + 268, by + 4, 16, dashFrac, '#7dd', '⇢');

      // --- Top-left: sector / biome ---
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = '#cfe9ff';
      ctx.fillText(`SECTOR ${game.sector}`, 18, 14);
      ctx.font = '12px monospace';
      ctx.fillStyle = 'rgba(160,200,230,0.7)';
      ctx.fillText(game.biome ? game.biome.name : '', 18, 33);
      if (game.daily) { ctx.font = 'bold 11px monospace'; ctx.fillStyle = 'rgba(255,210,120,0.85)'; ctx.fillText('☀ DAILY  ·  seed ' + (game.seed >>> 0).toString(36), 18, 50); }
      else if (game.depthTier > 0 && RE.DEEP_TIERS) { ctx.font = 'bold 11px monospace'; ctx.fillStyle = 'rgba(255,140,150,0.9)'; ctx.fillText('⇊ ' + RE.DEEP_TIERS[game.depthTier].name.toUpperCase(), 18, 50); }

      // --- Top-right: salvage / shards / score ---
      ctx.textAlign = 'right';
      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = '#ffe27a';
      ctx.fillText(`◈ ${game.salvage}`, W - 18, 14);
      ctx.fillStyle = '#c0a0ff';
      ctx.font = '12px monospace';
      ctx.fillText(`✦ ${RE.Save.data.coreShards + game.runShards}`, W - 18, 34);
      ctx.fillStyle = 'rgba(200,220,240,0.65)';
      ctx.fillText(`SCORE ${game.score}`, W - 18, 50);

      // --- Loadout icons (bottom-right) ---
      this._loadout(ctx, game, W - 18, H - 30);

      // --- Boss health bar ---
      if (game.boss && game.boss.alive) this._bossBar(ctx, game.boss, W, H, game);

      // --- Enemies remaining hint (subtle) ---
      // (kept minimal to preserve tension)

      // --- Interact prompt (near a Reconstructor) ---
      if (game._nearStation) {
        const pulse = 0.6 + 0.4 * Math.sin(game.time * 4);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = `rgba(255,220,140,${pulse})`;
        ctx.fillText('[ R ]  RECONSTRUCTOR', W / 2, H - 96);
      }

      // --- Banner ---
      if (this.banner) this._banner(ctx, W, H);

      // --- Toasts (center-bottom stack) ---
      this._toasts(ctx, W, H, game);

      // FPS
      if (RE.CFG.debug.fps || RE.Save.data.settings.showFps) {
        ctx.textAlign = 'left'; ctx.fillStyle = '#6f8'; ctx.font = '11px monospace';
        ctx.fillText(`${game.fps | 0} fps  e:${game.enemies.length} p:${game.projectiles.length}`, 18, H - 16);
      }

      ctx.restore();
    },

    _bar(ctx, x, y, w, h, frac, c1, c2, label, valText) {
      frac = M.clamp(frac, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      this._roundRect(ctx, x - 2, y - 2, w + 4, h + 4, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      this._roundRect(ctx, x, y, w, h, 3); ctx.fill();
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, c1); grad.addColorStop(1, c2);
      ctx.fillStyle = grad;
      this._roundRect(ctx, x, y, Math.max(0, w * frac), h, 3); ctx.fill();
      ctx.font = 'bold 9px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(label, x + 5, y + h / 2 + 0.5);
      ctx.textAlign = 'right';
      ctx.fillText(valText, x + w - 5, y + h / 2 + 0.5);
    },

    _pip(ctx, x, y, r, frac, color, glyph) {
      ctx.save();
      ctx.translate(x + r, y + r);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
      ctx.fillStyle = frac >= 1 ? color : 'rgba(255,255,255,0.4)';
      ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(glyph, 0, 1);
      ctx.restore();
    },

    _loadout(ctx, game, x, y) {
      const p = game.player;
      const slots = ['weapon', 'mobility', 'utility', 'defense'];
      const icons = { weapon: '⚔', mobility: '⇢', utility: '⚙', defense: '◈' };
      const size = 22, gap = 6;
      let cx = x - (size + gap) * slots.length + gap;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const slot of slots) {
        const id = p.modules[slot];
        ctx.fillStyle = id ? 'rgba(40,70,90,0.7)' : 'rgba(30,30,40,0.4)';
        this._roundRect(ctx, cx, y - size, size, size, 4); ctx.fill();
        ctx.strokeStyle = id ? 'rgba(140,220,255,0.6)' : 'rgba(120,120,140,0.3)';
        ctx.lineWidth = 1; ctx.stroke();
        ctx.font = '12px monospace';
        ctx.fillStyle = id ? '#cfe9ff' : 'rgba(120,120,140,0.5)';
        ctx.fillText(icons[slot], cx + size / 2, y - size / 2 + 1);
        cx += size + gap;
      }
    },

    _bossBar(ctx, boss, W, H, game) {
      const w = W * 0.6, x = (W - w) / 2, y = 24;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#ff9aa8';
      ctx.fillText(boss.name || 'GUARDIAN', W / 2, y - 4);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      this._roundRect(ctx, x - 2, y - 2, w + 4, 12, 4); ctx.fill();
      const frac = M.clamp(boss.hp / boss.maxHp, 0, 1);
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#ff2d55'); grad.addColorStop(1, '#ff9a3f');
      ctx.fillStyle = grad;
      this._roundRect(ctx, x, y, w * frac, 8, 3); ctx.fill();
    },

    _banner(ctx, W, H) {
      const b = this.banner;
      const t = b.t / b.life;
      let a = 1;
      if (t < 0.15) a = t / 0.15;
      else if (t > 0.7) a = 1 - (t - 0.7) / 0.3;
      ctx.globalAlpha = M.clamp(a, 0, 1);
      ctx.textAlign = 'center';
      ctx.font = 'bold 34px monospace';
      ctx.fillStyle = '#cfe9ff';
      ctx.shadowColor = '#2db6ff'; ctx.shadowBlur = 20;
      ctx.fillText(b.title, W / 2, H * 0.36);
      ctx.shadowBlur = 0;
      if (b.subtitle) {
        ctx.font = '15px monospace';
        ctx.fillStyle = 'rgba(180,210,235,0.8)';
        ctx.fillText(b.subtitle, W / 2, H * 0.36 + 28);
      }
      ctx.globalAlpha = 1;
    },

    _toasts(ctx, W, H, game) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let y = H * 0.66;
      for (let i = 0; i < this.toasts.length; i++) {
        const t = this.toasts[i];
        const k = t.t / t.life;
        let a = 1;
        if (k < 0.1) a = k / 0.1; else if (k > 0.75) a = 1 - (k - 0.75) / 0.25;
        ctx.globalAlpha = M.clamp(a, 0, 1);
        ctx.font = (t.big ? 'bold 16px' : '13px') + ' monospace';
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, W / 2, y);
        y += 22;
      }
      ctx.globalAlpha = 1;
    },

    _roundRect(ctx, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();

  <script>
/* ==== src/ui/menus.js ==== */
/* RoboExplore — menu / overlay screens with mouse + keyboard navigation.
 * Immediate-mode buttons with a shared focus index so the same code supports
 * clicking and arrow-key navigation.
 */
(function (RE) {
  'use strict';
  const M = RE.M;

  const Menus = {
    focus: 0,
    _i: 0,
    _lastCount: 1,
    _hoverSound: -1,

    begin(game) {
      this._i = 0;
      // keyboard nav
      if (RE.Input.pressed('up') || RE.Input.keyPressed('ArrowUp')) { this.focus = (this.focus - 1 + this._lastCount) % this._lastCount; RE.Audio.sfx('ui_move'); }
      if (RE.Input.pressed('down') || RE.Input.keyPressed('ArrowDown')) { this.focus = (this.focus + 1) % this._lastCount; RE.Audio.sfx('ui_move'); }
    },
    end() { this._lastCount = Math.max(1, this._i); if (this.focus >= this._lastCount) this.focus = 0; },

    button(ctx, game, o) {
      const idx = this._i++;
      const { x, y, w, h } = o;
      const mx = RE.Input.mouse.x, my = RE.Input.mouse.y;
      const hover = mx >= x && mx <= x + w && my >= y && my <= y + h;
      if (hover && (game._mouseMoved)) this.focus = idx;
      const focused = idx === this.focus;
      const active = focused || hover;

      ctx.save();
      // bg
      ctx.fillStyle = active ? 'rgba(50,110,150,0.55)' : 'rgba(24,40,54,0.55)';
      this._rr(ctx, x, y, w, h, 8); ctx.fill();
      ctx.strokeStyle = active ? '#7fe6ff' : 'rgba(120,180,220,0.35)';
      ctx.lineWidth = active ? 2 : 1;
      this._rr(ctx, x, y, w, h, 8); ctx.stroke();
      if (active) { ctx.shadowColor = '#2db6ff'; ctx.shadowBlur = 14; this._rr(ctx, x, y, w, h, 8); ctx.stroke(); ctx.shadowBlur = 0; }
      // label
      ctx.fillStyle = o.disabled ? 'rgba(150,160,175,0.5)' : (active ? '#eaffff' : '#bcd8ec');
      ctx.font = (o.font || 'bold 18px monospace');
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(o.label, x + w / 2, y + (o.sub ? h * 0.38 : h / 2 + 1));
      if (o.sub) {
        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(180,200,220,0.6)';
        ctx.fillText(o.sub, x + w / 2, y + h * 0.74);
      }
      ctx.restore();

      if (o.disabled) return false;
      const clicked = (hover && game.mousePressed) ||
        (focused && (RE.Input.keyPressed('Enter') || RE.Input.keyPressed('Space')));
      if (clicked) RE.Audio.sfx('ui');
      return clicked;
    },

    _panel(ctx, x, y, w, h, alpha) {
      ctx.fillStyle = `rgba(8,14,22,${alpha != null ? alpha : 0.82})`;
      this._rr(ctx, x, y, w, h, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(120,190,230,0.25)'; ctx.lineWidth = 1.5;
      this._rr(ctx, x, y, w, h, 14); ctx.stroke();
    },

    _dim(ctx, W, H, a) { ctx.fillStyle = `rgba(2,4,8,${a != null ? a : 0.55})`; ctx.fillRect(0, 0, W, H); },

    _titleGlow(ctx, text, x, y, size, color) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${size}px monospace`;
      ctx.shadowColor = color; ctx.shadowBlur = 24;
      ctx.fillStyle = '#eaffff';
      ctx.fillText(text, x, y);
      ctx.shadowBlur = 0;
    },

    // ---- Screens -------------------------------------------------------
    title(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      this.begin(game);
      this._titleGlow(ctx, 'ROBOEXPLORE', W / 2, H * 0.26, 52, '#2db6ff');
      ctx.textAlign = 'center';
      ctx.font = '13px monospace'; ctx.fillStyle = 'rgba(160,200,230,0.7)';
      ctx.fillText('descend into the Hollow · pulse to see · survive the dark', W / 2, H * 0.26 + 42);

      const bw = 260, bx = (W - bw) / 2;
      const daily = RE.Save.data.daily;
      const todays = (daily && daily.date === game._dailyKey()) ? `today's best: ${daily.best}` : 'a shared seed for everyone';
      const foundCount = Object.keys(RE.Save.data.logsFound || {}).length;
      const deep = RE.Save.data.deepTier || 0;

      const items = [
        { label: '▶  DESCEND', sub: 'begin a new run', font: 'bold 18px monospace', act: () => game.startRun() },
        { label: '☀  DAILY RUN', sub: todays, font: 'bold 16px monospace', act: () => game.startRun({ daily: true }) },
      ];
      if (deep >= 1) items.push({ label: '⇊  DEEP DESCENT', sub: `${RE.DEEP_TIERS[deep].name} · harder, richer`, font: 'bold 16px monospace', act: () => game.startRun({ tier: deep }) });
      items.push({ label: '✦  RECONSTRUCTOR', sub: `${RE.Save.data.coreShards} core-shards`, font: 'bold 18px monospace', act: () => game.openMeta() });
      items.push({ label: '❒  CODEX', sub: `${foundCount} fragments`, font: 'bold 16px monospace', act: () => game.openCodex('title') });
      items.push({ label: (RE.Audio.muted ? '🔇  SOUND: OFF' : '🔊  SOUND: ON'), font: 'bold 14px monospace', act: () => { const m = RE.Audio.toggleMute(); RE.Save.data.settings.muted = m; RE.Save.save(); } });

      const bh = items.length > 5 ? 37 : 42, gap = 8;
      let by = H * 0.40;
      for (const it of items) {
        if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: it.label, sub: it.sub, font: it.font })) it.act();
        by += bh + gap;
      }

      // stats footer
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(150,180,210,0.55)';
      ctx.fillText(`runs: ${RE.Save.data.runs}    deepest: sector ${RE.Save.data.bestSector}    best score: ${RE.Save.data.bestScore}`, W / 2, H - 40);
      ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(120,150,180,0.45)';
      ctx.fillText('WASD move · mouse aim/fire · E echo-pulse · Shift/Space dash · Esc pause', W / 2, H - 20);
      this.end();
    },

    pause(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      this._dim(ctx, W, H, 0.6);
      this.begin(game);
      this._titleGlow(ctx, 'PAUSED', W / 2, H * 0.26, 38, '#2db6ff');
      const bw = 240, bh = 42, bx = (W - bw) / 2;
      let by = H * 0.4;
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: 'RESUME' })) game.togglePause();
      by += bh + 10;
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: '❒  CODEX', font: 'bold 15px monospace' })) { game.state = 'playing'; game.openCodex('paused'); }
      by += bh + 10;
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: (RE.Audio.muted ? 'SOUND: OFF' : 'SOUND: ON'), font: 'bold 15px monospace' })) { const m = RE.Audio.toggleMute(); RE.Save.data.settings.muted = m; RE.Save.save(); }
      by += bh + 10;
      const sk = RE.Save.data.settings.screenShake; const skv = sk != null ? sk : 1;
      const skLabel = skv >= 1 ? 'SCREEN SHAKE: FULL' : skv > 0 ? 'SCREEN SHAKE: LOW' : 'SCREEN SHAKE: OFF';
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: skLabel, font: 'bold 14px monospace' })) { RE.Save.data.settings.screenShake = skv >= 1 ? 0.5 : skv > 0 ? 0 : 1; RE.Save.save(); }
      by += bh + 10;
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: 'ABANDON RUN', sub: 'return to title' })) game.abandonRun();
      // current loadout summary
      this._loadoutSummary(ctx, game, W / 2, by + bh + 30);
      this.end();
    },

    _loadoutSummary(ctx, game, cx, y) {
      const p = game.player; if (!p) return;
      ctx.textAlign = 'center'; ctx.font = '12px monospace';
      ctx.fillStyle = 'rgba(160,200,230,0.7)';
      const parts = [];
      for (const slot of ['weapon', 'mobility', 'utility', 'defense']) {
        const id = p.modules[slot];
        if (id) parts.push(RE.MODULES[id].name);
      }
      ctx.fillText(parts.join('  ·  ') || 'no modules equipped', cx, y);
    },

    gameover(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      this._dim(ctx, W, H, 0.72);
      this.begin(game);
      const won = game.won;
      this._titleGlow(ctx, won ? 'CORE REACHED' : 'SIGNAL LOST', W / 2, H * 0.18, 40, won ? '#7affd1' : '#ff4d6d');
      ctx.textAlign = 'center';

      // Mode tag + new-record callouts.
      const r0 = game.runStats;
      let modeLine = '';
      if (game.daily) modeLine = '☀ DAILY RUN · seed ' + (game.seed >>> 0).toString(36);
      else if (game.depthTier > 0 && RE.DEEP_TIERS) modeLine = '⇊ ' + RE.DEEP_TIERS[game.depthTier].name.toUpperCase();
      if (modeLine) { ctx.font = 'bold 12px monospace'; ctx.fillStyle = game.daily ? 'rgba(255,210,120,0.9)' : 'rgba(255,140,150,0.9)'; ctx.fillText(modeLine, W / 2, H * 0.18 + 26); }
      const newDaily = game.daily && game.dailyKey && RE.Save.data.daily && RE.Save.data.daily.date === game.dailyKey && RE.Save.data.daily.best === r0.score && r0.score > 0;
      if (newDaily) { ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#ffe27a'; ctx.fillText('★ NEW DAILY BEST ★', W / 2, H * 0.18 + 44); }

      // Ending narrative (win only).
      if (won) {
        ctx.font = 'italic 13px monospace'; ctx.fillStyle = 'rgba(200,235,255,0.85)';
        const ending = game.endingB
          ? ['The seat at the bottom is warm. You understand now why it glows.',
             'You do not sit down. You leave the light lit, and you climb —',
             'to tell the next one everything before the dark comes back.']
          : ['The Hollow goes dark, and for the first time it is quiet by choice.',
             'EX-0 carries the last light up the shaft, one ring at a time.',
             'The counter on the chassis stops. It does not need to turn again.'];
        let ey = H * 0.30;
        for (const l of ending) { ctx.fillText(l, W / 2, ey); ey += 20; }
      }

      ctx.font = '14px monospace'; ctx.fillStyle = '#cfe9ff';
      const r = game.runStats;
      const lines = [
        `reached sector ${r.sector}`,
        `${r.kills} enemies destroyed  ·  score ${r.score}`,
        `✦ ${r.shards} core-shards salvaged`,
      ];
      let ly = won ? H * 0.48 : H * 0.35;
      for (const l of lines) { ctx.fillText(l, W / 2, ly); ly += 22; }
      // "afford now" nudge — cheapest unbought meta node
      const nudge = this._cheapestUnbought();
      if (nudge) { ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(192,160,255,0.8)'; ctx.fillText(`Afford now: ${nudge.name} (✦${nudge.cost})`, W / 2, ly + 4); }

      const bw = 240, bh = 44, bx = (W - bw) / 2;
      let by = H * 0.66;
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: '↻  NEW RUN' })) game.startRun();
      by += bh + 10;
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: '✦  RECONSTRUCTOR', sub: `${RE.Save.data.coreShards} shards` })) game.openMeta();
      by += bh + 10;
      if (this.button(ctx, game, { x: bx, y: by, w: bw, h: bh, label: 'TITLE' })) game.gotoTitle();
      this.end();
    },

    _cheapestUnbought() {
      const shards = RE.Save.data.coreShards;
      let best = null;
      for (const u of (RE.META_UPGRADES || [])) {
        if (RE.Save.data.unlocks[u.id]) continue;
        if (u.req && !RE.Save.data.unlocks[u.req]) continue;
        if (u.cost <= shards && (!best || u.cost < best.cost)) best = u;
      }
      return best;
    },

    reward(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      this._dim(ctx, W, H, 0.6);
      this.begin(game);
      ctx.textAlign = 'center';
      this._titleGlow(ctx, game.rewardTitle || 'SALVAGE RECOVERED', W / 2, H * 0.16, 26, '#ff8adf');
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(180,200,220,0.7)';
      ctx.fillText('choose a module to integrate', W / 2, H * 0.16 + 26);

      const choices = game.rewardChoices || [];
      const cw = 210, ch = 150, gap = 24;
      const totalW = choices.length * cw + (choices.length - 1) * gap;
      let cx = (W - totalW) / 2;
      const cy = H * 0.3;
      for (let i = 0; i < choices.length; i++) {
        const def = choices[i];
        const idx = this._i++;
        const hover = RE.Input.mouse.x >= cx && RE.Input.mouse.x <= cx + cw && RE.Input.mouse.y >= cy && RE.Input.mouse.y <= cy + ch;
        if (hover && game._mouseMoved) this.focus = idx;
        const focused = idx === this.focus;
        const active = focused || hover;
        this._card(ctx, def, cx, cy, cw, ch, active);
        const clicked = (hover && game.mousePressed) || (focused && (RE.Input.keyPressed('Enter') || RE.Input.keyPressed('Space')));
        if (clicked) { RE.Audio.sfx('equip'); game.chooseReward(def); }
        cx += cw + gap;
      }

      // skip / take salvage instead
      const bw = 200, bh = 36;
      if (this.button(ctx, game, { x: (W - bw) / 2, y: cy + ch + 26, w: bw, h: bh, label: 'SKIP  (+15 salvage)', font: 'bold 13px monospace' })) game.skipReward();
      this.end();
    },

    _card(ctx, def, x, y, w, h, active) {
      const rarColors = { common: '#9fd8ff', uncommon: '#7affa0', rare: '#c08bff', legendary: '#ffcf5a' };
      const rc = rarColors[def.rarity] || '#9fd8ff';
      ctx.fillStyle = active ? 'rgba(30,50,66,0.9)' : 'rgba(18,30,42,0.85)';
      this._rr(ctx, x, y, w, h, 10); ctx.fill();
      ctx.strokeStyle = active ? rc : RE.M.rgba(rc, 0.4);
      ctx.lineWidth = active ? 2.5 : 1.5;
      if (active) { ctx.shadowColor = rc; ctx.shadowBlur = 18; }
      this._rr(ctx, x, y, w, h, 10); ctx.stroke();
      ctx.shadowBlur = 0;
      // slot icon strip
      ctx.fillStyle = RE.M.rgba(rc, 0.15);
      this._rr(ctx, x, y, w, 30, 10); ctx.fill();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '10px monospace'; ctx.fillStyle = rc;
      ctx.fillText(def.slot.toUpperCase() + ' · ' + def.rarity.toUpperCase(), x + 12, y + 15);
      // name
      ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#eaffff';
      ctx.fillText(def.name, x + 12, y + 52);
      // desc (wrapped)
      ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(190,210,230,0.85)';
      this._wrap(ctx, def.desc, x + 12, y + 74, w - 24, 15);
    },

    _wrap(ctx, text, x, y, maxW, lh) {
      const words = String(text).split(' ');
      let line = '', yy = y;
      for (const wd of words) {
        const test = line + wd + ' ';
        if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = wd + ' '; yy += lh; }
        else line = test;
      }
      if (line) ctx.fillText(line, x, yy);
      return yy;
    },

    station(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      this._dim(ctx, W, H, 0.62);
      this.begin(game);
      ctx.textAlign = 'center';
      this._titleGlow(ctx, 'RECONSTRUCTOR', W / 2, H * 0.13, 28, '#ffd27a');
      ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#ffe27a';
      ctx.fillText(`◈ ${game.salvage} salvage`, W / 2, H * 0.13 + 26);

      const st = game.station; if (!st) { this.end(); return; }
      const mods = st.stock.modules;
      // module cards
      const cw = 200, ch = 150, gap = 22;
      const totalW = mods.length * cw + (mods.length - 1) * gap;
      let cx = (W - totalW) / 2; const cy = H * 0.26;
      for (let i = 0; i < mods.length; i++) {
        const def = mods[i];
        const idx = this._i++;
        const hover = RE.Input.mouse.x >= cx && RE.Input.mouse.x <= cx + cw && RE.Input.mouse.y >= cy && RE.Input.mouse.y <= cy + ch;
        if (hover && game._mouseMoved) this.focus = idx;
        const focused = idx === this.focus, active = focused || hover;
        if (def) {
          this._card(ctx, def, cx, cy, cw, ch, active);
          const cost = game.stationCost(def);
          const afford = game.salvage >= cost;
          ctx.textAlign = 'center'; ctx.font = 'bold 13px monospace';
          ctx.fillStyle = afford ? '#ffe27a' : 'rgba(180,160,120,0.5)';
          ctx.fillText('◈ ' + cost, cx + cw / 2, cy + ch - 12);
          const clicked = (hover && game.mousePressed) || (focused && (RE.Input.keyPressed('Enter') || RE.Input.keyPressed('Space')));
          if (clicked && afford) game.stationBuy(def, i);
        } else {
          ctx.fillStyle = 'rgba(18,26,36,0.6)'; this._rr(ctx, cx, cy, cw, ch, 10); ctx.fill();
          ctx.strokeStyle = 'rgba(90,100,120,0.3)'; this._rr(ctx, cx, cy, cw, ch, 10); ctx.stroke();
          ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(120,130,150,0.5)'; ctx.font = '12px monospace';
          ctx.fillText('— installed —', cx + cw / 2, cy + ch / 2);
        }
        cx += cw + gap;
      }

      // service buttons
      const bw = 190, bh = 40, by = cy + ch + 26;
      const repairCost = 20 + st.stock.repairUses * 10;
      const gx = (W - (bw * 4 + 30)) / 2;
      const fullHull = game.player && game.player.hull >= game.player.hullMax;
      if (this.button(ctx, game, { x: gx, y: by, w: bw, h: bh, label: 'REPAIR +30', sub: `◈ ${repairCost}`, font: 'bold 14px monospace', disabled: game.salvage < repairCost || fullHull })) game.stationRepair();
      if (this.button(ctx, game, { x: gx + bw + 10, y: by, w: bw, h: bh, label: st.stock.refillUsed ? 'ENERGY: TAPPED' : 'ENERGY TAP', sub: st.stock.refillUsed ? '' : 'free refill', font: 'bold 14px monospace', disabled: st.stock.refillUsed })) game.stationRefill();
      if (this.button(ctx, game, { x: gx + (bw + 10) * 2, y: by, w: bw, h: bh, label: 'REROLL STOCK', sub: '◈ 12', font: 'bold 14px monospace', disabled: game.salvage < 12 })) game.stationReroll();
      if (this.button(ctx, game, { x: gx + (bw + 10) * 3, y: by, w: bw, h: bh, label: 'LEAVE', font: 'bold 14px monospace' })) game.closeStation();
      this.end();
    },

    meta(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      this._dim(ctx, W, H, 0.8);
      this.begin(game);
      ctx.textAlign = 'center';
      this._titleGlow(ctx, 'RECONSTRUCTOR', W / 2, 54, 30, '#c0a0ff');
      ctx.font = '13px monospace'; ctx.fillStyle = '#c0a0ff';
      ctx.fillText(`✦ ${RE.Save.data.coreShards} core-shards`, W / 2, 84);

      const upgrades = RE.META_UPGRADES || [];
      const cols = 3, cw = 250, ch = 80, gap = 13;
      const totalW = cols * cw + (cols - 1) * gap;
      let startX = (W - totalW) / 2;
      let x = startX, y = 100, col = 0;
      for (const u of upgrades) {
        const idx = this._i++;
        const level = RE.Save.data.unlocks[u.id] ? (typeof RE.Save.data.unlocks[u.id] === 'number' ? RE.Save.data.unlocks[u.id] : 1) : 0;
        const maxed = u.max ? level >= u.max : level >= 1;
        const cost = u.cost + (u.costPer ? level * u.costPer : 0);
        const hover = RE.Input.mouse.x >= x && RE.Input.mouse.x <= x + cw && RE.Input.mouse.y >= y && RE.Input.mouse.y <= y + ch;
        if (hover && game._mouseMoved) this.focus = idx;
        const focused = idx === this.focus;
        const active = focused || hover;
        const reqMet = !u.req || RE.Save.data.unlocks[u.req];
        const affordable = !maxed && reqMet && RE.Save.data.coreShards >= cost;

        ctx.fillStyle = active ? 'rgba(40,32,60,0.9)' : 'rgba(24,20,38,0.85)';
        this._rr(ctx, x, y, cw, ch, 8); ctx.fill();
        ctx.strokeStyle = maxed ? 'rgba(120,255,160,0.6)' : (affordable ? (active ? '#c0a0ff' : 'rgba(160,130,220,0.5)') : 'rgba(120,100,140,0.3)');
        ctx.lineWidth = active ? 2 : 1.2;
        this._rr(ctx, x, y, cw, ch, 8); ctx.stroke();
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#eaffff';
        ctx.fillText(u.name + (u.max ? `  ${level}/${u.max}` : ''), x + 12, y + 12);
        ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(190,200,230,0.8)';
        this._wrap(ctx, u.desc, x + 12, y + 34, cw - 24, 13);
        ctx.font = 'bold 12px monospace';
        ctx.fillStyle = maxed ? '#7affa0' : (affordable ? '#c0a0ff' : 'rgba(150,130,170,0.6)');
        ctx.fillText(maxed ? 'OWNED' : (!reqMet ? '🔒 locked' : `✦ ${cost}`), x + 12, y + ch - 18);

        if ((hover && game.mousePressed || (focused && (RE.Input.keyPressed('Enter') || RE.Input.keyPressed('Space')))) && affordable) {
          game.buyMeta(u, cost);
        }
        col++; x += cw + gap;
        if (col >= cols) { col = 0; x = startX; y += ch + gap; }
      }

      const bw = 200, bh = 40;
      if (this.button(ctx, game, { x: (W - bw) / 2, y: H - 56, w: bw, h: bh, label: '◀  BACK' })) game.closeMeta();
      this.end();
    },

    codex(ctx, game) {
      const W = RE.CFG.viewW, H = RE.CFG.viewH;
      this._dim(ctx, W, H, 0.85);
      this.begin(game);
      ctx.textAlign = 'center';
      this._titleGlow(ctx, 'FIELD MEMORY', W / 2, 46, 28, '#9fe6ff');
      const all = Object.values(RE.LOGS || {});
      const found = all.filter(l => RE.Save.data.logsFound[l.id]);
      ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(160,200,230,0.7)';
      ctx.fillText(`${found.length} / ${all.length} fragments recovered`, W / 2, 72);

      const cols = 2, cw = 400, ch = 96, gap = 18;
      const totalW = cols * cw + gap;
      let x = (W - totalW) / 2, y = 92, col = 0;
      const shown = found.slice(0, 8);
      for (const l of shown) {
        ctx.fillStyle = 'rgba(20,30,44,0.85)';
        this._rr(ctx, x, y, cw, ch, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(120,190,230,0.35)'; ctx.lineWidth = 1;
        this._rr(ctx, x, y, cw, ch, 8); ctx.stroke();
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#cfe9ff';
        ctx.fillText(l.title, x + 12, y + 10);
        ctx.font = '9px monospace'; ctx.fillStyle = 'rgba(150,180,210,0.6)';
        ctx.fillText('— ' + l.source, x + 12, y + 26);
        ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(190,210,230,0.85)';
        this._wrap(ctx, l.text, x + 12, y + 42, cw - 24, 14);
        col++; x += cw + gap;
        if (col >= cols) { col = 0; x = (W - totalW) / 2; y += ch + gap; }
      }
      if (!found.length) {
        ctx.textAlign = 'center'; ctx.font = '13px monospace'; ctx.fillStyle = 'rgba(160,190,220,0.6)';
        ctx.fillText('No fragments recovered yet. Pulse into the dark corners of the Hollow.', W / 2, H / 2);
      }
      if (found.length > 8) { ctx.textAlign = 'center'; ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(150,180,210,0.5)'; ctx.fillText(`+${found.length - 8} more recovered`, W / 2, H - 76); }

      const bw = 200, bh = 40;
      if (this.button(ctx, game, { x: (W - bw) / 2, y: H - 56, w: bw, h: bh, label: '◀  BACK' })) game.closeCodex();
      this.end();
    },

    _rr(ctx, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    },
  };

  RE.Menus = Menus;
})(window.RE = window.RE || {});
