<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>RoboExplore</title>
  <style>
/* RoboExplore — page shell & canvas presentation */
:root {
  --bg: #05070c;
  --ink: #cfe9ff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#game-root {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(1200px 800px at 50% 40%, #0a1020 0%, #05070c 70%, #020306 100%);
}
#game {
  display: block;
  image-rendering: optimizeQuality;
  /* sized by JS to preserve aspect ratio and fill available space */
  box-shadow: 0 0 60px rgba(0, 20, 60, 0.5), 0 0 3px rgba(120, 200, 255, 0.15);
  outline: none;
  cursor: crosshair;
}
#rotate-hint {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  opacity: 0.35;
  pointer-events: none;
  display: none;
}
@media (max-aspect-ratio: 1/1) and (max-width: 720px) {
  #rotate-hint { display: block; }
}
  </style>
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>
    <div id="rotate-hint">Rotate your device or widen the window for the best experience.</div>

/* ==== src/util/rng.js ==== */
/* RoboExplore — seeded pseudo-random number generation
 * Deterministic RNG so a given seed reproduces a run's world.
 */
(function (RE) {
  'use strict';

  // mulberry32: fast, decent-quality 32-bit PRNG.
  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Hash a string into a 32-bit seed (xfnv1a-ish).
  function hashSeed(str) {
    str = String(str);
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeRNG(seed) {
    const numSeed = typeof seed === 'number' ? (seed >>> 0) : hashSeed(seed);
    const next = mulberry32(numSeed);
    const api = {
      seed: numSeed,
      next,                                   // float [0,1)
      float: (min, max) => min + next() * (max - min),
      int: (min, max) => Math.floor(min + next() * (max - min + 1)), // inclusive
      range: (min, max) => min + next() * (max - min),
      bool: (p = 0.5) => next() < p,
      sign: () => (next() < 0.5 ? -1 : 1),
      pick: (arr) => arr[(next() * arr.length) | 0],
      // Weighted pick: items = [{w, ...}] or ([item], [weight]).
      weighted: (items, weightFn) => {
        let total = 0;
        for (const it of items) total += weightFn ? weightFn(it) : (it.w || 1);
        let r = next() * total;
        for (const it of items) {
          r -= weightFn ? weightFn(it) : (it.w || 1);
          if (r <= 0) return it;
        }
        return items[items.length - 1];
      },
      shuffle: (arr) => {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = (next() * (i + 1)) | 0;
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      },
      // Angle in radians, full circle.
      angle: () => next() * Math.PI * 2,
      // Fork a child RNG (deterministic, independent stream).
      fork: (salt) => makeRNG((numSeed ^ hashSeed('' + salt)) >>> 0),
    };
    return api;
  }

  // A default, non-deterministic seed generator for run seeds.
  function randomSeed() {
    return (Math.floor(Math.random() * 0xffffffff)) >>> 0;
  }

  RE.RNG = { make: makeRNG, hashSeed, randomSeed, mulberry32 };
})(window.RE = window.RE || {});

  <script>
/* ==== src/util/math.js ==== */
/* RoboExplore — math & small helpers */
(function (RE) {
  'use strict';

  const TAU = Math.PI * 2;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
  // Frame-rate independent smoothing factor for exponential lerp.
  const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

  const dist2 = (ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    return dx * dx + dy * dy;
  };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

  // Shortest signed angular difference b - a, in (-PI, PI].
  function angleDiff(a, b) {
    let d = (b - a) % TAU;
    if (d < -Math.PI) d += TAU;
    if (d > Math.PI) d -= TAU;
    return d;
  }
  // Rotate `a` toward `b` by at most `maxStep` radians.
  function rotateToward(a, b, maxStep) {
    const d = angleDiff(a, b);
    if (Math.abs(d) <= maxStep) return b;
    return a + Math.sign(d) * maxStep;
  }

  // Easing functions.
  const ease = {
    inQuad: t => t * t,
    outQuad: t => t * (2 - t),
    inOutQuad: t => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
    outCubic: t => (--t) * t * t + 1,
    inCubic: t => t * t * t,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => {
      const c4 = (2 * Math.PI) / 3;
      return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    },
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  };

  // Circle vs circle overlap.
  function circleOverlap(ax, ay, ar, bx, by, br) {
    const r = ar + br;
    return dist2(ax, ay, bx, by) < r * r;
  }

  // Approach a value toward target by a fixed step (per call).
  function approach(v, target, step) {
    if (v < target) return Math.min(v + step, target);
    if (v > target) return Math.max(v - step, target);
    return v;
  }

  // Color helpers ---------------------------------------------------------
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const n = parseInt(hex, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function rgba(hex, a) {
    const c = hexToRgb(hex);
    return `rgba(${c.r},${c.g},${c.b},${a})`;
  }
  function mixHex(hexA, hexB, t) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(lerp(a.r, b.r, t));
    const g = Math.round(lerp(a.g, b.g, t));
    const bl = Math.round(lerp(a.b, b.b, t));
    return `rgb(${r},${g},${bl})`;
  }

  RE.M = {
    TAU, clamp, lerp, invLerp, damp, dist, dist2, angleDiff, rotateToward,
    ease, circleOverlap, approach, hexToRgb, rgba, mixHex,
    PI: Math.PI,
  };
})(window.RE = window.RE || {});

  <script>
/* ==== src/engine/input.js ==== */
/* RoboExplore — input (keyboard + mouse + basic gamepad + touch fallback).
 * Exposes edge-triggered "pressed" queries and continuous "down" state,
 * plus a world-space aim vector supplied by the game each frame.
 */
(function (RE) {
  'use strict';

  const Input = {
    keys: Object.create(null),       // current down state by code
    _pressed: Object.create(null),   // pressed-this-frame
    _released: Object.create(null),
    mouse: { x: 0, y: 0, sx: 0, sy: 0, down: false, _pressed: false, right: false },
    wheel: 0,
    pad: null,
    canvas: null,
    // mapping of logical actions -> key codes
    bindings: {
      up: ['KeyW', 'ArrowUp'],
      down: ['KeyS', 'ArrowDown'],
      left: ['KeyA', 'ArrowLeft'],
      right: ['KeyD', 'ArrowRight'],
      dash: ['ShiftLeft', 'ShiftRight', 'Space'],
      echo: ['KeyE', 'KeyQ'],
      shield: ['KeyF'],
      pause: ['Escape', 'KeyP'],
      map: ['Tab', 'KeyM'],
      confirm: ['Enter', 'Space'],
      interact: ['KeyR'],
      swap: ['KeyQ'],
      mute: ['KeyM'],
    },

    init(canvas) {
      this.canvas = canvas;
      window.addEventListener('keydown', (e) => {
        if (!this.keys[e.code]) this._pressed[e.code] = true;
        this.keys[e.code] = true;
        // Prevent page scroll for game keys.
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) {
          e.preventDefault();
        }
      }, { passive: false });
      window.addEventListener('keyup', (e) => {
        this.keys[e.code] = false;
        this._released[e.code] = true;
      });
      window.addEventListener('blur', () => { this.keys = Object.create(null); });

      const setMouse = (e) => {
        const r = canvas.getBoundingClientRect();
        this.mouse.sx = (e.clientX - r.left) / r.width;
        this.mouse.sy = (e.clientY - r.top) / r.height;
      };
      canvas.addEventListener('mousemove', setMouse);
      canvas.addEventListener('mousedown', (e) => {
        setMouse(e);
        if (e.button === 0) { this.mouse.down = true; this.mouse._pressed = true; }
        if (e.button === 2) { this.mouse.right = true; }
      });
      window.addEventListener('mouseup', (e) => {
        if (e.button === 0) this.mouse.down = false;
        if (e.button === 2) this.mouse.right = false;
      });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      canvas.addEventListener('wheel', (e) => { this.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });

      // Touch: single-touch acts like a pointer + tap.
      const touch = (e) => {
        if (e.touches && e.touches[0]) {
          const t = e.touches[0];
          const r = canvas.getBoundingClientRect();
          this.mouse.sx = (t.clientX - r.left) / r.width;
          this.mouse.sy = (t.clientY - r.top) / r.height;
        }
      };
      canvas.addEventListener('touchstart', (e) => { touch(e); this.mouse.down = true; this.mouse._pressed = true; e.preventDefault(); }, { passive: false });
      canvas.addEventListener('touchmove', (e) => { touch(e); e.preventDefault(); }, { passive: false });
      canvas.addEventListener('touchend', () => { this.mouse.down = false; }, { passive: false });

      window.addEventListener('gamepadconnected', () => {});
    },

    _anyDown(codes) { for (const c of codes) if (this.keys[c]) return true; return false; },
    _anyPressed(codes) { for (const c of codes) if (this._pressed[c]) return true; return false; },

    // Logical action queries.
    down(action) { return this._anyDown(this.bindings[action] || []); },
    pressed(action) { return this._anyPressed(this.bindings[action] || []); },

    // Raw code query.
    keyPressed(code) { return !!this._pressed[code]; },
    keyDown(code) { return !!this.keys[code]; },

    // Normalized movement vector from WASD/arrows (+ gamepad left stick).
    moveVector() {
      let x = 0, y = 0;
      if (this.down('left')) x -= 1;
      if (this.down('right')) x += 1;
      if (this.down('up')) y -= 1;
      if (this.down('down')) y += 1;
      const pad = this._pollPad();
      if (pad) {
        const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
        if (Math.abs(ax) > 0.22) x += ax;
        if (Math.abs(ay) > 0.22) y += ay;
      }
      const len = Math.hypot(x, y);
      if (len > 1) { x /= len; y /= len; }
      return { x, y, len: Math.min(len, 1) };
    },

    _pollPad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) if (p) return p;
      return null;
    },

    // Called by the game once per frame with the resolved mouse position in
    // internal view coordinates (0..viewW, 0..viewH).
    setViewMouse(x, y) { this.mouse.x = x; this.mouse.y = y; },

    mousePressed() { return this.mouse._pressed; },

    // Clear per-frame edge state. Call at the very end of the frame.
    endFrame() {
      this._pressed = Object.create(null);
      this._released = Object.create(null);
      this.mouse._pressed = false;
      this.wheel = 0;
    },
  };

  RE.Input = Input;
})(window.RE = window.RE || {});
  </script>
  <script>
/* ==== src/engine/audio.js ==== */
/* RoboExplore — WebAudio synthesizer.
 * All sound is generated live: oscillators, noise, filters, envelopes.
 * No audio files. A master bus with gain + soft limiter feeds destination.
 */
(function (RE) {
  'use strict';

  const Audio = {
    ctx: null,
    master: null,
    musicBus: null,
    sfxBus: null,
    ready: false,
    muted: false,
    volume: 0.8,
    _music: null,

    init() {
      // Created lazily on first user gesture (autoplay policy).
    },

    _ensure() {
      if (this.ctx) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      this.ctx = ctx;

      const master = ctx.createGain();
      master.gain.value = this.volume;
      // Gentle limiter to avoid clipping on stacked SFX.
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.knee.value = 20;
      comp.ratio.value = 8;
      comp.attack.value = 0.003;
      comp.release.value = 0.18;
      master.connect(comp);
      comp.connect(ctx.destination);
      this.master = master;

      const sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      const musicBus = ctx.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
      this.sfxBus = sfxBus;
      this.musicBus = musicBus;
      this.ready = true;
      return true;
    },

    resume() {
      if (!this._ensure()) return;
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    setMuted(m) {
      this.muted = m;
      if (this.master) this.master.gain.value = m ? 0 : this.volume;
    },
    toggleMute() { this.setMuted(!this.muted); return this.muted; },

    _now() { return this.ctx.currentTime; },

    // --- Primitive builders ------------------------------------------------
    _env(gain, t0, a, d, s, r, peak, sustain) {
      const g = gain.gain;
      g.cancelScheduledValues(t0);
      g.setValueAtTime(0.0001, t0);
      g.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + a);
      g.exponentialRampToValueAtTime(Math.max(0.0001, sustain), t0 + a + d);
      // release handled by caller via stop time
    },

    // A tone with envelope. opts: {type,freq,to,dur,a,d,peak,gain,bus,detune,slideDur}
    tone(opts) {
      if (!this.ready || this.muted) return;
      const ctx = this.ctx, t0 = this._now();
      const o = ctx.createOscillator();
      o.type = opts.type || 'sine';
      o.frequency.setValueAtTime(opts.freq, t0);
      if (opts.to != null) {
        o.frequency.exponentialRampToValueAtTime(Math.max(1, opts.to), t0 + (opts.slideDur || opts.dur || 0.15));
      }
      if (opts.detune) o.detune.setValueAtTime(opts.detune, t0);
      const g = ctx.createGain();
      const peak = (opts.gain != null ? opts.gain : 0.3);
      const dur = opts.dur || 0.18;
      const a = opts.a != null ? opts.a : 0.005;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      let node = g;
      if (opts.filter) {
        const f = ctx.createBiquadFilter();
        f.type = opts.filter.type || 'lowpass';
        f.frequency.setValueAtTime(opts.filter.freq || 1200, t0);
        if (opts.filter.to != null) f.frequency.exponentialRampToValueAtTime(opts.filter.to, t0 + dur);
        f.Q.value = opts.filter.q || 1;
        g.connect(f); node = f;
      }
      node.connect(opts.bus || this.sfxBus);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    },

    // Filtered noise burst. opts: {dur,gain,type,freq,to,q,bus}
    noise(opts) {
      if (!this.ready || this.muted) return;
      const ctx = this.ctx, t0 = this._now();
      const dur = opts.dur || 0.2;
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = opts.type || 'bandpass';
      f.frequency.setValueAtTime(opts.freq || 900, t0);
      if (opts.to != null) f.frequency.exponentialRampToValueAtTime(Math.max(30, opts.to), t0 + dur);
      f.Q.value = opts.q || 1;
      const g = ctx.createGain();
      const peak = opts.gain != null ? opts.gain : 0.25;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(opts.bus || this.sfxBus);
      src.start(t0);
      src.stop(t0 + dur + 0.02);

    sfx(name, param) {
      if (!this.ready || this.muted) return;
      switch (name) {
        case 'echo':
          this.tone({ type: 'sine', freq: 520, to: 190, dur: 0.5, gain: 0.28, filter: { type: 'lowpass', freq: 2600, to: 600 } });
          this.tone({ type: 'triangle', freq: 780, to: 300, dur: 0.35, gain: 0.12 });
          break;
        case 'dash':
          this.noise({ dur: 0.18, freq: 1800, to: 300, gain: 0.22, type: 'bandpass', q: 0.7 });
          this.tone({ type: 'sawtooth', freq: 320, to: 130, dur: 0.16, gain: 0.16, filter: { type: 'lowpass', freq: 1400, to: 400 } });
          break;
        case 'shoot':
          this.tone({ type: 'square', freq: 620, to: 260, dur: 0.09, gain: 0.14, filter: { type: 'lowpass', freq: 2400 } });
          break;
        case 'shoot_heavy':
          this.tone({ type: 'sawtooth', freq: 240, to: 90, dur: 0.16, gain: 0.2, filter: { type: 'lowpass', freq: 1400 } });
          break;
        case 'hit': {
          const m = param || 1;   // pitch multiplier (tracks target HP)
          this.noise({ dur: 0.09, freq: 2200 * m, to: 700 * m, gain: 0.16, type: 'highpass', q: 0.6 });
          break;
        }
        case 'enemy_die': {

/* RoboExplore — pooled particle system.
 * Fixed-capacity ring of particle structs to avoid GC churn. Particles are

  'use strict';

  function makeParticle() {

      drag: 0, grav: 0, shrink: 1, glow: true, kind: 'dot',
      rot: 0, vr: 0, seed: 0,

    pool: [],
    idx: 0,

    init() {
      this.pool = new Array(MAX);
      for (let i = 0; i < MAX; i++) this.pool[i] = makeParticle();
      this.idx = 0;

    _spawn() {

      const p = this.pool[this.idx];
      this.idx = (this.idx + 1) % MAX;
      return p;
    },

    emit(opts) {
      const p = this._spawn();
      p.alive = true;
      p.x = opts.x; p.y = opts.y;
      p.vx = opts.vx || 0; p.vy = opts.vy || 0;
      p.life = 0; p.maxLife = opts.life || 0.5;
      p.size = opts.size || 2.5;
      p.color = opts.color || '#8ff';
      p.drag = opts.drag != null ? opts.drag : 2.5;
      p.grav = opts.grav || 0;
      p.shrink = opts.shrink != null ? opts.shrink : 1;
      p.glow = opts.glow !== false;

      p.rot = opts.rot || 0;
      p.vr = opts.vr || 0;

    burst(x, y, n, opts) {

      const spread = opts.spread != null ? opts.spread : Math.PI * 2;
      const dir = opts.dir != null ? opts.dir : 0;
      for (let i = 0; i < n; i++) {
        const a = dir + (Math.random() - 0.5) * spread;
        const s = spd * (0.35 + Math.random() * 0.65);
        this.emit({
          x, y,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: (opts.life || 0.5) * (0.6 + Math.random() * 0.6),
          size: (opts.size || 3) * (0.6 + Math.random() * 0.7),
          color: opts.color || '#9ef',
          drag: opts.drag != null ? opts.drag : 3.5,
          grav: opts.grav || 0,
          shrink: opts.shrink != null ? opts.shrink : 1,
          kind: opts.kind || 'dot',
          glow: opts.glow !== false,
          vr: (Math.random() - 0.5) * 8,

    ring(x, y, opts) {
      opts = opts || {};

        x, y, vx: 0, vy: 0,
        life: opts.life || 0.4, size: opts.size || 8,
        color: opts.color || '#8ef', kind: 'ring', drag: 0, shrink: 0,
        glow: true,

    update(dt) {
      const pool = this.pool;
      for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (!p.alive) continue;
        p.life += dt;
        if (p.life >= p.maxLife) { p.alive = false; continue; }
        const d = Math.exp(-p.drag * dt);
        p.vx *= d; p.vy *= d;

        p.x += p.vx * dt;

/* RoboExplore — camera with smooth follow, look-ahead, and trauma-based shake. */
(function (RE) {
  'use strict';
  const M = RE.M;

  const Camera = {
    x: 0, y: 0,            // top-left of view in world space
    tx: 0, ty: 0,          // desired center target
    viewW: 960, viewH: 540,
    trauma: 0,             // 0..1, decays over time
    shakeT: 0,
    _seed: Math.random() * 1000,
    zoom: 1,

    init(viewW, viewH) {
      this.viewW = viewW; this.viewH = viewH;
      this.trauma = 0;
    },

    // Center immediately on a point (e.g. new sector).
    snapTo(x, y) {
      this.tx = x; this.ty = y;
      this.x = x - this.viewW / 2;
      this.y = y - this.viewH / 2;
    },

    follow(targetX, targetY, vx, vy, cfg, dt, bounds, cursor) {
      // velocity lead — so pulses reveal ahead of your motion
      let leadX = M.clamp((vx || 0) * cfg.lookAheadVel, -cfg.lookAheadMax, cfg.lookAheadMax);
      let leadY = M.clamp((vy || 0) * cfg.lookAheadVel, -cfg.lookAheadMax, cfg.lookAheadMax);
      // aim bias — bias the view toward where you're aiming
      if (cursor) {
        leadX += M.clamp((cursor.x - targetX) * cfg.aimBias, -cfg.aimMax, cfg.aimMax);
        leadY += M.clamp((cursor.y - targetY) * cfg.aimBias, -cfg.aimMax, cfg.aimMax);
      }
      this.tx = targetX + leadX;
      this.ty = targetY + leadY;
      const cx = this.x + this.viewW / 2;
      const cy = this.y + this.viewH / 2;
      // deadzone kills micro-jitter when nearly settled
      const dz = cfg.deadzone || 0;
      let tx = this.tx, ty = this.ty;
      if (Math.abs(tx - cx) < dz && Math.abs(vx || 0) < 6) tx = cx;
      if (Math.abs(ty - cy) < dz && Math.abs(vy || 0) < 6) ty = cy;
      const ncx = M.damp(cx, tx, cfg.followLambda, dt);
      const ncy = M.damp(cy, ty, cfg.followLambda, dt);
      this.x = ncx - this.viewW / 2;
      this.y = ncy - this.viewH / 2;
      if (bounds) this._clamp(bounds);
    },

    _clamp(b) {
      // b = {w, h} world size in px. Keep view inside, or center if smaller.
      if (b.w <= this.viewW) this.x = (b.w - this.viewW) / 2;
      else this.x = M.clamp(this.x, 0, b.w - this.viewW);
      if (b.h <= this.viewH) this.y = (b.h - this.viewH) / 2;
      else this.y = M.clamp(this.y, 0, b.h - this.viewH);
    },

    addTrauma(amount) {
      this.trauma = M.clamp(this.trauma + amount, 0, 1);

      this.shakeT += dt;
      this.trauma = Math.max(0, this.trauma - dt * 1.6);

    shakeOffset(maxShake) {
      if (this.trauma <= 0) return { x: 0, y: 0 };
      const s = this.trauma * this.trauma; // quadratic feels better
      const mag = (maxShake || 20) * s;
      const t = this.shakeT * 42 + this._seed;
      // pseudo-noise via layered sines
      const nx = Math.sin(t * 1.3) * 0.6 + Math.sin(t * 2.7) * 0.4;

    },

/* RoboExplore — procedural cave generation.
 * Cellular-automata caverns with guaranteed connectivity, a spawn and an exit
 * placed far apart, plus feature slots (energy nodes, salvage, stations,
 * pickups, enemy spawn hints, log fragments). Fully seeded/deterministic.

  function generate(opts) {

    const W = opts.w, H = opts.h;

    const steps = opts.steps != null ? opts.steps : 5;
    const openness = opts.openness != null ? opts.openness : 0; // -1 tighter, +1 more open

        else set(x, y, rng.next() < fill ? WALL : FLOOR);

    // 2. Smoothing iterations (4-5 rule variant).
    const birth = 5 - Math.max(0, openness);
    const survive = 4 + Math.min(0, openness);
    for (let s = 0; s < steps; s++) {
      const next = new Uint8Array(W * H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) { next[y * W + x] = WALL; continue; }
          let n = 0;
          for (let dy = -1; dy <= 1; dy++)
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              if (at(x + dx, y + dy) === WALL) n++;
            }
          const cur = at(x, y);
          if (cur === WALL) next[y * W + x] = (n >= survive) ? WALL : FLOOR;
          else next[y * W + x] = (n > birth) ? WALL : FLOOR;
        }
      }
      grid = next;
    }
    const at2 = (x, y) => grid[y * W + x];

    // 3. Flood fill to find the largest open region; fill the rest.
    const region = new Int32Array(W * H).fill(-1);
    let bestId = -1, bestSize = 0, regionCount = 0;
    const regions = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;

          const id = regionCount++;

            const c = stack.pop();

            for (const nn of neigh) {
              const nx = nn % W, ny = (nn / W) | 0;
              if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
              if (grid[nn] === FLOOR && region[nn] === -1) { region[nn] = id; stack.push(nn); }
            }

          regions.push(cells);
          if (cells.length > bestSize) { bestSize = cells.length; bestId = id; }

    // Fill non-main regions (keep only the biggest cavern for guaranteed connectivity).
    for (let i = 0; i < grid.length; i++) {

          const nx = nn % W, ny = (nn / W) | 0;

    const a = bfsFarthest(seed0);
    const b = bfsFarthest(a.far);       // b.far is the true diameter endpoint
    const spawnIdx = a.far;
    const exitIdx = b.far;

    const reachable = openCells.filter(i => distFromSpawn[i] >= 0);
    function pickFeatureCell(minDistFromSpawn, minApart) {
      let tries = 0;
      while (tries++ < 60) {
        const c = reachable[(rng.next() * reachable.length) | 0];
        if (distFromSpawn[c] < minDistFromSpawn) continue;
        if (tooClose(c, minApart || 4)) continue;
        usedFeature.add(c);
        return c;
      }
      // fallback: any free cell
      for (const c of reachable) if (!usedFeature.has(c)) { usedFeature.add(c); return c; }
      return spawnIdx;
    }

    return {
      w: W, h: H, grid, WALL, FLOOR,
      openCells, reachable, region, mainRegion: bestId,
      spawn: cellXY(spawnIdx), exit: cellXY(exitIdx),
      spawnIdx, exitIdx, distFromSpawn,
      cellXY, pickFeatureCell, rng,
      diameter: b.farD,
    };
  }

/* ==== src/world/tilemap.js ==== */
/* RoboExplore — tilemap wrapper: collision queries against the generated grid.
 * Coordinates: world px. Tile size from CFG.tile.
 */
(function (RE) {
  'use strict';
  const M = RE.M;

  function makeTilemap(gen, tileSize) {
    const W = gen.w, H = gen.h, T = tileSize;
    const grid = gen.grid;

    const map = {
      w: W, h: H, tile: T,
      pxW: W * T, pxH: H * T,
      grid, gen,

      isWallTile(tx, ty) {
        if (tx < 0 || ty < 0 || tx >= W || ty >= H) return true;
        return grid[ty * W + tx] === gen.WALL;
      },
      isWallPx(px, py) {
        return this.isWallTile((px / T) | 0, (py / T) | 0);
      },
      tileAtPx(px, py) {
        return { tx: (px / T) | 0, ty: (py / T) | 0 };
      },
      centerOfTile(tx, ty) {
        return { x: (tx + 0.5) * T, y: (ty + 0.5) * T };
      },

      // Resolve a circle (cx,cy,r) against walls; returns corrected {x,y,hitX,hitY}.
      // Samples the 3x3 tile neighborhood and pushes out of overlapping walls.
      collideCircle(cx, cy, r) {
        let hitX = false, hitY = false;
        const minTx = ((cx - r) / T | 0) - 1;
        const maxTx = ((cx + r) / T | 0) + 1;
        const minTy = ((cy - r) / T | 0) - 1;
        const maxTy = ((cy + r) / T | 0) + 1;
        for (let ty = minTy; ty <= maxTy; ty++) {
          for (let tx = minTx; tx <= maxTx; tx++) {
            if (!this.isWallTile(tx, ty)) continue;
            const rx = tx * T, ry = ty * T;
            // closest point on tile AABB to circle center
            const nx = M.clamp(cx, rx, rx + T);
            const ny = M.clamp(cy, ry, ry + T);
            let dx = cx - nx, dy = cy - ny;
            const d2 = dx * dx + dy * dy;
            if (d2 < r * r) {
              let d = Math.sqrt(d2);
              if (d === 0) {
                // center inside tile — push along least-penetration axis
                const left = cx - rx, right = rx + T - cx;
                const top = cy - ry, bottom = ry + T - cy;
                const mMin = Math.min(left, right, top, bottom);
                if (mMin === left) { cx = rx - r; hitX = true; }
                else if (mMin === right) { cx = rx + T + r; hitX = true; }
                else if (mMin === top) { cy = ry - r; hitY = true; }
                else { cy = ry + T + r; hitY = true; }
              } else {
                const push = (r - d);
                cx += (dx / d) * push;
                cy += (dy / d) * push;
                if (Math.abs(dx) > Math.abs(dy)) hitX = true; else hitY = true;
              }
            }
          }
        }
        return { x: cx, y: cy, hitX, hitY };
      },

      // Line-of-sight / raycast against walls (DDA). Returns hit point or null.
      // Used for enemy vision and projectile wall checks.
      raycast(x0, y0, x1, y1) {
        const dx = x1 - x0, dy = y1 - y0;
        const steps = Math.ceil(Math.hypot(dx, dy) / (T * 0.4));
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const px = x0 + dx * t, py = y0 + dy * t;
          if (this.isWallPx(px, py)) return { x: px, y: py, t, tx: (px / T) | 0, ty: (py / T) | 0 };
        }
        return null;
      },
      hasLOS(x0, y0, x1, y1) { return this.raycast(x0, y0, x1, y1) === null; },
    };
    return map;
  }

  RE.Tilemap = { make: makeTilemap };
})(window.RE = window.RE || {});

/* ==== src/entities/projectile.js ==== */
/* RoboExplore — projectiles (player bolts and enemy shots).
 * Glowing energy — always visible in the dark. Player shots are light-casters:
 * they softly wash the tiles they pass, faintly revealing a lane. Supports
 * wall-bounce, piercing, splash, and an on-expire hook (spitter puddles).
 */
(function (RE) {
  'use strict';
  const Particles = RE.Particles;

  function makeProjectile(opts) {
    return {
      type: 'projectile',
      alive: true,
      x: opts.x, y: opts.y,
      vx: opts.vx, vy: opts.vy,
      r: opts.r || 4,
      damage: opts.damage || 8,
      life: 0,
      maxLife: opts.life || 0.85,
      color: opts.color || '#8ff',
      friendly: !!opts.friendly,
      pierce: opts.pierce || 0,
      bounce: opts.bounce || 0,
      illuminate: opts.illuminate || 0,
      splash: opts.splash || 0,
      splashDmg: opts.splashDmg || 0,
      knockback: opts.knockback || 0,
      beam: !!opts.beam,
      homing: !!opts.homing,
      homTurn: opts.homTurn || 4,
      hitSet: null,
      trail: 0,
      onExpire: opts.onExpire || null,
      puddleOnHit: opts.puddleOnHit || false,

      update(dt, game) {
        this.life += dt;
        if (this.life >= this.maxLife) { this.alive = false; if (this.onExpire) this.onExpire(); return; }
        // homing: steer toward the nearest living enemy
        if (this.homing && this.friendly && game.enemies) {
          let best = null, bd = 1e9;
          for (const e of game.enemies) { if (!e.alive) continue; const dd = (e.x - this.x) * (e.x - this.x) + (e.y - this.y) * (e.y - this.y); if (dd < bd) { bd = dd; best = e; } }
          if (best) {
            const desired = Math.atan2(best.y - this.y, best.x - this.x);
            const cur = Math.atan2(this.vy, this.vx);
            const na = RE.M.rotateToward(cur, desired, this.homTurn * dt);
            const sp = Math.hypot(this.vx, this.vy);
            this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
          }
        }
        const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
        if (game.map.isWallPx(nx, ny)) {
          if (this.bounce > 0) {
            // reflect off the offending axis
            const hitX = game.map.isWallPx(this.x + this.vx * dt, this.y);
            const hitY = game.map.isWallPx(this.x, this.y + this.vy * dt);
            if (hitX) this.vx = -this.vx;
            if (hitY) this.vy = -this.vy;
            if (!hitX && !hitY) { this.vx = -this.vx; this.vy = -this.vy; }
            this.bounce--;
            Particles.burst(this.x, this.y, 3, { speed: 90, color: this.color, life: 0.2, size: this.r * 0.6, kind: 'spark' });
          } else {
            this.alive = false; this._impact(game, true); if (this.onExpire) this.onExpire(); return;
          }
        } else { this.x = nx; this.y = ny; }

        // light-caster reveal
        if (this.illuminate > 0 && this.friendly) RE.Echo.washSoft(this.x, this.y, this.illuminate, 0.5);

        this.trail += dt;
        if (this.trail > 0.02) {
          this.trail = 0;
          Particles.emit({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.18, size: this.r * 0.8, color: this.color, drag: 4, kind: 'dot' });
        }
      },

      _impact(game, wall) {
        Particles.burst(this.x, this.y, wall ? 5 : 7, { speed: 130, color: this.color, life: 0.32, size: this.r * 0.7, kind: 'spark' });
        if (this.puddleOnHit && this.onExpire) { this.onExpire(); this.onExpire = null; }
        if (wall) RE.Audio.sfx('hit');
      },

      render(ctx, cam) {
        const sx = this.x - cam.x, sy = this.y - cam.y;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, this.r * 4);
        gr.addColorStop(0, this.color);
        gr.addColorStop(0.3, RE.M.rgba(this.color, 0.5));
        gr.addColorStop(1, RE.M.rgba(this.color, 0));
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(sx, sy, this.r * 4, 0, Math.PI * 2); ctx.fill();
        if (this.beam) {
          // draw a short streak for the lance
          const a = Math.atan2(this.vy, this.vx);
          ctx.strokeStyle = this.color; ctx.lineWidth = this.r;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - Math.cos(a) * 40, sy - Math.sin(a) * 40); ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(sx, sy, this.r * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      },
    };
  }

  RE.makeProjectile = makeProjectile;

/* ==== src/entities/pickup.js ==== */
/* RoboExplore — pickups: salvage, energy, hull, modules, core-shards, logs,
 * and the sector exit. Pickups are dim until echo/light reveals them, which
 * reinforces the core loop: pulse to find what's worth grabbing.
 */
(function (RE) {
  'use strict';
  const M = RE.M, Particles = RE.Particles;

  const KIND = {
    salvage:  { r: 8,  color: '#ffe27a', glow: '#fff2b0', sfx: 'pickup' },
    energy:   { r: 9,  color: '#4ad6ff', glow: '#b6ecff', sfx: 'energy' },
    node:     { r: 16, color: '#4ad6ff', glow: '#b6ecff', sfx: null },
    hull:     { r: 9,  color: '#5affa0', glow: '#c4ffe0', sfx: 'pickup' },
    module:   { r: 12, color: '#ff8adf', glow: '#ffc9ef', sfx: 'pickup_big' },
    shard:    { r: 10, color: '#c0a0ff', glow: '#e6d9ff', sfx: 'pickup_big' },
    log:      { r: 10, color: '#9fe6ff', glow: '#d6f5ff', sfx: 'pickup' },
    exit:     { r: 20, color: '#7affd1', glow: '#d0fff0', sfx: null },
    station:  { r: 18, color: '#ffd27a', glow: '#fff0c4', sfx: null },

  function makePickup(kind, x, y, opts) {
    opts = opts || {};
    const k = KIND[kind] || KIND.salvage;

      type: 'pickup',
      kind, alive: true,
      x, y, r: opts.r || k.r,
      color: k.color, glow: k.glow,
      value: opts.value || 0,
      data: opts.data || null,     // module def, log text, etc.
      magnetized: false,
      bob: Math.random() * Math.PI * 2,
      spin: Math.random() * Math.PI * 2,
      collectible: kind !== 'exit' && kind !== 'station' && kind !== 'node',
      solidStation: kind === 'station',

  <script>
/* ==== src/entities/enemy.js ==== */
/* RoboExplore — enemies with echo-aware AI.
 * Shared toolkit: reveal (`vis`) that decays over enemyVisFade unless re-lit;
 * echo-resonance marking (+40% dmg for MARK_TIME when a pulse washes them);
 * flinch; "the Hollow listens" aggro toward pulse origins. Each `ai` is a small
 * state machine faithful to the design bestiary.
 */
(function (RE) {
  'use strict';
  const M = RE.M, CFG = RE.CFG, Particles = RE.Particles;

  function makeEnemy(defId, x, y, sector, elite) {
    const def = RE.ENEMIES[defId];
    const hpMul = (1 + (sector - 1) * 0.06) * (elite ? 2 : 1);
    const dmgMul = (1 + (sector - 1) * 0.05) * (elite ? 1.3 : 1);
    const spdMul = 1 + (sector - 1) * 0.02;

    const e = {
      type: 'enemy', def, id: defId, alive: true, elite: !!elite,
      x, y, vx: 0, vy: 0,
      r: def.radius,
      hp: Math.round(def.hp * hpMul), maxHp: Math.round(def.hp * hpMul),
      speed: def.speed * spdMul, dmgMul, sector,
      facing: Math.random() * Math.PI * 2,
      awake: false, vis: 0, marked: 0, lensMarked: false,
      hitFlash: 0, touchCd: 0,
      state: 'idle', stateT: 0,
      fireCd: (def.fireCd || 1) * (0.4 + Math.random() * 0.6),
      orbitDir: Math.random() < 0.5 ? 1 : -1,
      wobble: Math.random() * Math.PI * 2,
      _pingedBy: -1, _curContact: 0,
      // per-ai scratch
      podAngle: Math.random() * Math.PI * 2, aimT: 0, charges: 0, beamAngle: Math.random() * Math.PI * 2,
      _homeX: x, _homeY: y, driftA: Math.random() * Math.PI * 2,

      // ---- damage / death ----
      effectiveArmor() {
        // Gloom Crawler is armored while frozen (lit).
        if (this.def.ai === 'freezer' && this.state === 'frozen') return this.def.litArmor || 0.5;
        // Hollow Stalker takes +50% in recover.
        if (this.def.ai === 'stalker' && this.state === 'recover') return 1.5;
        return 1;
      },
      takeDamage(dmg, kx, ky, game) {
        if (!this.alive) return;
        // Abyssal Eye only takes damage while open.
        if (this.def.ai === 'eye' && this.state !== 'open') { this._deflect(); return; }
        // Warden armored shell handled by hp (simplified).
        let d = dmg * this.effectiveArmor();
        if (this.marked > 0) d *= CFG.player.markDamageMul;
        this.hp -= d;
        this.hitFlash = 0.12;
        this.awake = true;
        this.vis = Math.max(this.vis, 0.6);
        this.vx += (kx || 0); this.vy += (ky || 0);
        // hit sound, pitched up as the enemy nears death
        RE.Audio.sfx('hit', 0.8 + (1 - Math.max(0, this.hp) / this.maxHp) * 0.7);
        Particles.burst(this.x, this.y, 4, { speed: 90, color: def.glow, life: 0.25, size: 2.5, kind: 'spark' });
        if (this.hp <= 0) this.die(game);
      },
      _deflect() {
        Particles.burst(this.x, this.y, 3, { speed: 60, color: '#fff', life: 0.2, size: 2, kind: 'spark' });
      },
      die(game) {
        if (!this.alive) return;
        this.alive = false;
        RE.Audio.sfx('enemy_die', M.clamp(30 / this.maxHp, 0.5, 1.6));
        Particles.burst(this.x, this.y, 16, { speed: 200, color: def.glow, life: 0.6, size: 3.4, kind: 'spark' });
        Particles.burst(this.x, this.y, 8, { speed: 90, color: def.color, life: 0.5, size: 3, kind: 'dot' });
        Particles.ring(this.x, this.y, { color: def.glow, size: this.r, life: 0.4 });
        game.camera.addTrauma(0.12);
        if (this.def.ai === 'mine') this._detonate(game);
        game.onEnemyKilled(this);
      },

      // ---- reveal / mark ----
      onSwept(pulse, game) {
        if (this._pingedBy === pulse.id) return;
        this._pingedBy = pulse.id;
        this.vis = 1;
        const p = game.player;
        // base echo-resonance mark
        this.marked = Math.max(this.marked, CFG.player.markTime);
        if (p.stats.markFromEcho) { this.marked = Math.max(this.marked, p.stats.markDur); this.lensMarked = true; }
        // Warden Node is charged (awoken) by pulses washing it.
        if (this.def.ai === 'turret') this.charges++;
        // fragile flinch (mines keep arming — they must not be reset by a pulse)
        if (this.maxHp <= 24 && this.def.ai !== 'mine' && this.state !== 'lunge' && this.state !== 'pounce') { this.state = 'flinch'; this.stateT = 0; }
        // resonant cannon echo damage
        if (p.stats.echoDamage > 0) this.takeDamage(p.stats.echoDamage, 0, 0, game);
        if (this.def.wakeOnPing !== false) this.awake = true;
        // directional ping intel
        game.spawnEnemyPing(this.x, this.y);
      },

      update(dt, game) {
        const p = game.player;
        this.stateT += dt; this.wobble += dt * 3;
        if (this.hitFlash > 0) this.hitFlash -= dt;
        if (this.touchCd > 0) this.touchCd -= dt;
        if (this.marked > 0) { this.marked -= dt; if (this.marked <= 0) this.lensMarked = false; }
        this._curContact = 0;

        // reveal by pulse sweep
        const sweep = RE.Echo.pulseSweeping(this.x, this.y, this.r);
        if (sweep) this.onSwept(sweep, game);
        // reveal by ambient light
        const light = RE.Echo.lightAt(this.x, this.y, p);
        if (light > 0.45) { this.vis = Math.max(this.vis, Math.min(1, light)); }
        // vis decay
        if (this.def.selfLit) this.vis = 1;
        else if (this.vis > 0) { this.vis -= dt / CFG.player.enemyVisFade; if (this.vis < 0) this.vis = 0; }

        if (this.state === 'flinch') { this._friction(dt); if (this.stateT > 0.15) { this.state = 'idle'; } this._integrate(dt, game); return; }

        if (!p || !p.alive) { this._friction(dt); this._integrate(dt, game); return; }
        const d = M.dist(this.x, this.y, p.x, p.y);

        switch (def.ai) {
          case 'moth': this._aiMoth(dt, game, p, d, light); break;
          case 'buried': this._aiBuried(dt, game, p, d); break;
          case 'freezer': this._aiFreezer(dt, game, p, d, light); break;
          case 'orbiter': this._aiOrbiter(dt, game, p, d); break;
          case 'spitter': this._aiSpitter(dt, game, p, d); break;
          case 'turret': this._aiTurret(dt, game, p, d); break;
          case 'wraith': this._aiWraith(dt, game, p, d); break;
          case 'mine': this._aiMine(dt, game, p, d); break;
          case 'stalker': this._aiStalker(dt, game, p, d); break;
          case 'eye': this._aiEye(dt, game, p, d); break;
          default: this._aiChaser(dt, game, p, d); break;
        }

        if (def.speed > 0) this._separate(dt, game);
        this._integrate(dt, game);

        // contact damage
        if (this._curContact > 0 && d < this.r + p.radius && this.touchCd <= 0) {
          if (game.damagePlayer(this._curContact * this.dmgMul, this)) {
            this.touchCd = CFG.player.contactDamageCd;
          }
        }
      },

      // ===== AI behaviors =====
      _aiChaser(dt, game, p, d) {
        if (!this.awake && d > 260) { this._friction(dt); return; }
        this.awake = true;
        this._steerTo(p.x, p.y, dt);
        this._curContact = def.touchDamage;
      },

      // Lumen Moth — drifts near-invisible; lured by pulses/light toward source.
      _aiMoth(dt, game, p, d, light) {
        const heard = game.lastPulse && (game.time - game.lastPulse.t) < 0.2 && M.dist(this.x, this.y, game.lastPulse.x, game.lastPulse.y) < def.lureRange;
        if (this.state === 'lured') {
          this._steerTo(p.x, p.y, dt, def.lureSpeed / this.speed);
          this._curContact = def.touchDamage;
          if (this.stateT > def.lureTime) { this.state = 'drift'; this.stateT = 0; }
        } else {
          // drift
          this.driftA += (Math.random() - 0.5) * dt * 3;
          this.vx = M.damp(this.vx, Math.cos(this.driftA) * this.speed * 0.4, 4, dt);
          this.vy = M.damp(this.vy, Math.sin(this.driftA) * this.speed * 0.4, 4, dt);
          if (heard || this.marked > 0 || d < 90) { this.state = 'lured'; this.stateT = 0; RE.Audio.sfx('blip', 900); }
        }
      },

      // Silt Lurker — buried until pulsed; lunges when the player nears.
      _aiBuried(dt, game, p, d) {
        if (this.state === 'idle' || this.state === 'buried') {
          this.state = 'buried'; this._friction(dt);
          if (d < def.triggerRange) { this.state = 'windup'; this.stateT = 0; this.facing = Math.atan2(p.y - this.y, p.x - this.x); }
        } else if (this.state === 'windup') {
          this._friction(dt);
          if (this.stateT > def.windup) {
            this.state = 'lunge'; this.stateT = 0;
            this.vx = Math.cos(this.facing) * def.lungeSpeed;
            this.vy = Math.sin(this.facing) * def.lungeSpeed;
            RE.Audio.sfx('dash'); this.vis = 1;
          }
        } else if (this.state === 'lunge') {
          this._curContact = def.touchDamage;
          if (this.stateT > def.lungeTime) { this.state = 'exposed'; this.stateT = 0; }
        } else if (this.state === 'exposed') {
          this._steerTo(p.x, p.y, dt, 0.6);
          this.vis = Math.max(this.vis, 0.5);
          if (this.stateT > def.exposed) { this.state = 'buried'; this.stateT = 0; }
        }
      },

      // Gloom Crawler — weeping angel: hunts in dark, freezes when lit.
      _aiFreezer(dt, game, p, d, light) {
        const lit = light > 0.15 || RE.Echo.pulseSweeping(this.x, this.y, this.r);
        if (lit) {
          if (this.state !== 'frozen') { this.state = 'frozen'; this.stateT = 0; }
          this._friction(dt); this.vis = Math.max(this.vis, 0.9);
          this._litTimer = 0.3;
        } else {
          if (this._litTimer > 0) { this._litTimer -= dt; this._friction(dt); return; }
          if (this.state === 'frozen') { this.state = 'hunt'; this.stateT = 0; RE.Audio.sfx('blip', 120); }
          this.state = 'hunt'; this.awake = true;
          this._steerTo(p.x, p.y, dt);
          this._curContact = def.touchDamage;
        }
      },

      // Sparkfly — self-lit pod orbiting the player, peeling off to dive.
      _aiOrbiter(dt, game, p, d) {
        this.awake = true;
        if (this.state === 'dive') {
          this._steerTo(p.x, p.y, dt, def.diveSpeed / this.speed);
          this._curContact = def.touchDamage;
          if (this.stateT > 0.6 || d < this.r + p.radius) { this.state = 'orbit'; this.stateT = 0; }
        } else {
          this.podAngle += this.orbitDir * dt * 1.3;
          const tx = p.x + Math.cos(this.podAngle) * def.orbitDist;
          const ty = p.y + Math.sin(this.podAngle) * def.orbitDist;
          this._steerTo(tx, ty, dt, 0.9);
          this.fireCd -= dt;
          if (this.fireCd <= 0) { this.fireCd = def.chargeEvery * (0.7 + Math.random() * 0.6); if (Math.random() < 0.5) { this.state = 'dive'; this.stateT = 0; RE.Audio.sfx('blip', 1200); } }
        }
      },

      // Rift Spitter — ranged; lights the room when it aims and fires puddles.
      _aiSpitter(dt, game, p, d) {
        if (!this.awake && d > def.range) { this._friction(dt); return; }
        this.awake = true;
        const hasLOS = game.map.hasLOS(this.x, this.y, p.x, p.y);
        if (this.state === 'aim') {
          this._friction(dt); this.facing = Math.atan2(p.y - this.y, p.x - this.x);
          this.vis = Math.max(this.vis, 0.4 + 0.4 * (this.stateT / def.aimTime));
          RE.Echo.washSoft(this.x, this.y, 70, 0.35);
          if (this.stateT > def.aimTime) { this._fireGlob(game, p); this.state = 'roam'; this.stateT = 0; this.fireCd = def.fireCd; }
        } else {
          // roam / keep distance
          if (d < def.range * 0.5) { const a = Math.atan2(this.y - p.y, this.x - p.x); this._steerTo(this.x + Math.cos(a) * 60, this.y + Math.sin(a) * 60, dt, 0.7); }
          else this._steerTo(p.x, p.y, dt, 0.4);
          this.fireCd -= dt;
          if (this.fireCd <= 0 && d < def.range && hasLOS) { this.state = 'aim'; this.stateT = 0; }
        }
      },
      _fireGlob(game, p) {
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        const proj = game.spawnEnemyProjectile(this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r,
          Math.cos(a) * def.projSpeed, Math.sin(a) * def.projSpeed, def.projDamage, def.glow);
        if (proj) { proj.illuminate = 70; proj.onExpire = () => game.spawnHazard(proj.x, proj.y, def.puddleR, def.puddleDamage, def.puddleLife, def.glow); proj.puddleOnHit = true; }
        RE.Audio.sfx('shoot_heavy');
      },

      // Warden Node — dormant turret; pulses charge it; sweeps a beam.
      _aiTurret(dt, game, p, d) {
        if (this.state === 'idle' || this.state === 'dormant') {
          this.state = 'dormant';
          // charged by pulses (onSwept increments) or proximity
          if (this.charges >= def.pulseCharges || d < def.proxRange) { this.state = 'spinup'; this.stateT = 0; RE.Audio.sfx('lowpower'); }
        } else if (this.state === 'spinup') {
          this.vis = Math.max(this.vis, 0.6);
          if (this.stateT > def.spinup) { this.state = 'sweep'; this.stateT = 0; this.beamAngle = Math.atan2(p.y - this.y, p.x - this.x); }
        } else if (this.state === 'sweep') {
          this.vis = 1;
          this.beamAngle += def.beamRotSpeed * dt;
          RE.Echo.washSoft(this.x, this.y, def.beamLen * 0.6, 0.25);
          this._beamDamage(dt, game, p, this.beamAngle, def.beamArc, def.beamLen, def.beamDamage);
          if (this.stateT > def.sweepTime) { this.state = 'cooldown'; this.stateT = 0; this.charges = 0; }
        } else if (this.state === 'cooldown') {
          this.vis = Math.max(this.vis, 0.4);
          if (this.stateT > def.cooldown) { this.state = (d < def.proxRange ? 'spinup' : 'dormant'); this.stateT = 0; }
        }
      },

      // Echo Wraith — phased/invisible until pulsed, then blinks onto you.
      _aiWraith(dt, game, p, d) {
        if (this.state === 'idle' || this.state === 'phased') {
          this.state = 'phased';
          this._steerTo(p.x, p.y, dt, 1);   // drifts toward player intangibly
          this.vis *= 0.9;
          if (this._pingedBy >= 0 && RE.Echo.pulseSweeping(this.x, this.y, this.r)) { this.state = 'material'; this.stateT = 0; this.vis = 1; }
        } else if (this.state === 'material') {
          this._friction(dt); this.vis = 1;
          this.facing = Math.atan2(p.y - this.y, p.x - this.x);
          if (this.stateT > def.blinkDelay && !this._blinked) {
            this._blinked = true;
            const a = Math.atan2(p.y - this.y, p.x - this.x);
            // blink to just inside melee reach and land a discrete slash
            this.x = p.x - Math.cos(a) * (this.r + p.radius - 6);
            this.y = p.y - Math.sin(a) * (this.r + p.radius - 6);
            game.damagePlayer(def.slashDamage * this.dmgMul, this);
            Particles.burst(this.x, this.y, 12, { speed: 200, color: '#fff', life: 0.3, size: 3, kind: 'spark' });
          }
          if (this.stateT > def.materialTime) { this.state = 'phased'; this.stateT = 0; this._blinked = false; }
        }
      },

      // Barnacle — proximity mine, cloaked until pulsed.
      _aiMine(dt, game, p, d) {
        this._friction(dt);
        if (this.state === 'idle' || this.state === 'cloaked') {
          this.state = 'cloaked';
          if (d < 55) { this.state = 'armed'; this.stateT = 0; }
        } else if (this.state === 'armed') {
          this.vis = Math.max(this.vis, 0.5);
          const freq = 2 + (this.stateT / def.armTime) * 8;
          if (Math.sin(this.stateT * freq * Math.PI * 2) > 0.9) RE.Audio.sfx('blip', 1400);
          if (this.stateT > def.armTime) this.die(game);
        }
      },
      _detonate(game) {
        const p = game.player;
        Particles.burst(this.x, this.y, 26, { speed: 320, color: def.glow, life: 0.6, size: 3.5, kind: 'spark' });
        RE.Echo.pulse(this.x, this.y, { maxR: def.blastR, speed: 900, strength: 0.8 });
        game.camera.addTrauma(0.3);
        RE.Audio.sfx('enemy_die');
        if (p && p.alive) {
          const d = M.dist(this.x, this.y, p.x, p.y);
          if (d < def.blastR) {
            const t = 1 - d / def.blastR;
            game.damagePlayer(M.lerp(def.blastMin, def.blastMax, t), this);
          }
        }

        for (const o of game.enemies) {
          if (o !== this && o.alive && o.def.ai === 'mine' && M.dist(this.x, this.y, o.x, o.y) < def.chainR) {
            o.state = 'armed'; o.stateT = def.armTime - 0.25;
          }
        }
      },

      // Hollow Stalker — elite apex pouncer.
      _aiStalker(dt, game, p, d) {
        this.awake = true;
        if (this.state === 'pounce') {
          this._curContact = def.pounceDamage;
          if (this.stateT > 0.55 || M.dist(this.x, this.y, this._pounceTx, this._pounceTy) < 20) { this.state = 'recover'; this.stateT = 0; this._friction(dt); }
        } else if (this.state === 'recover') {
          this._steerTo(p.x, p.y, dt, 0.4); this.vis = Math.max(this.vis, 0.5);
          if (this.stateT > def.recover) this.state = 'circle';
        } else if (this.state === 'crouch') {
          this._friction(dt); this.vis = Math.max(this.vis, 0.7);
          this.facing = Math.atan2(p.y - this.y, p.x - this.x);
          if (this.stateT > def.crouch) {
            this.state = 'pounce'; this.stateT = 0;
            this.vx = Math.cos(this.facing) * def.pounceSpeed;
            this.vy = Math.sin(this.facing) * def.pounceSpeed;
            this._pounceTx = p.x; this._pounceTy = p.y;
            RE.Audio.sfx('dash');
          }
        } else {
          // circle just outside light
          const ang = Math.atan2(this.y - p.y, this.x - p.x) + this.orbitDir * 0.7 * dt;
          const tx = p.x + Math.cos(ang) * 150, ty = p.y + Math.sin(ang) * 150;
          this._steerTo(tx, ty, dt, 0.8);
          this.fireCd -= dt;
          if (this.fireCd <= 0 && game.map.hasLOS(this.x, this.y, p.x, p.y)) { this.fireCd = def.pounceEvery; this.state = 'crouch'; this.stateT = 0; }
        }
      },

      // Abyssal Eye — opens to light, fires a tracking gaze, only-then vulnerable.
      _aiEye(dt, game, p, d) {
        this.vx = 0; this.vy = 0;
        if (this.state === 'idle' || this.state === 'shut') {
          this.state = 'shut';
          if (RE.Echo.pulseSweeping(this.x, this.y, this.r) || RE.Echo.lightAt(this.x, this.y, p) > 0.5) { this.state = 'opening'; this.stateT = 0; RE.Audio.sfx('lowpower'); }
        } else if (this.state === 'opening') {
          this.vis = Math.max(this.vis, this.stateT / def.openTime);
          if (this.stateT > def.openTime) { this.state = 'open'; this.stateT = 0; this.beamAngle = Math.atan2(p.y - this.y, p.x - this.x); }
        } else if (this.state === 'open') {
          this.vis = 1;
          const target = Math.atan2(p.y - this.y, p.x - this.x);
          this.beamAngle = M.rotateToward(this.beamAngle, target, def.gazeTrack * dt);
          RE.Echo.washSoft(this.x, this.y, def.gazeLen * 0.5, 0.3);
          this._beamDamage(dt, game, p, this.beamAngle, def.gazeArc, def.gazeLen, def.gazeDamage);
          if (this.stateT > def.gazeTime) { this.state = 'closing'; this.stateT = 0; }
        } else if (this.state === 'closing') {
          this.vis = Math.max(0, 1 - this.stateT / def.closeTime);
          if (this.stateT > def.closeTime) { this.state = 'cooldown'; this.stateT = 0; }
        } else if (this.state === 'cooldown') {
          if (this.stateT > def.cooldown) { this.state = 'shut'; this.stateT = 0; }
        }
      },

      _beamDamage(dt, game, p, ang, arc, len, dmg) {
        const d = M.dist(this.x, this.y, p.x, p.y);
        if (d > len) return;

      _renderBeam(ctx, cam) {

  <script>
/* ==== src/entities/boss.js ==== */
/* RoboExplore — boss framework: multi-phase threshold guardians.
 * A boss is enemy-compatible (lives in game.enemies, game.boss) but self-lit
 * and driven by a phase/attack script. Every damaging attack is telegraphed
 * with a bright, self-lit tell so fights stay fair in the dark.
 *
 * Attacks are data-driven building blocks (radial / aimed / spiral / shockwave

  'use strict';

      name: def.name, x, y, vx: 0, vy: 0,
      r: def.radius, color: def.color, glow: def.glow,
      hp: def.hp, maxHp: def.hp, sector,
      dmgMul: Math.max(1, 1 + (sector - 15) * 0.02),
      phaseIndex: 0, phase: def.phases[0],
      facing: 0, hitFlash: 0, marked: 0, vis: 1, awake: true, elite: false,
      attackCd: 1.2, atkIndex: 0,
      tele: null,            // active telegraph {type,t,dur,data,exec}
      rings: [],             // shockwaves
      addTimer: 0,
      moveT: Math.random() * 10,
      invuln: def.introInvuln || 0,
      _blackoutT: 0,
      dead: false,

      takeDamage(dmg, kx, ky, game) {
        if (!this.alive || this.invuln > 0) { Particles.burst(this.x, this.y, 2, { speed: 40, color: '#fff', life: 0.15, size: 2, kind: 'spark' }); return; }
        let d = dmg;
        if (this.marked > 0) d *= CFG.player.markDamageMul;
        this.hp -= d;
        this.hitFlash = 0.08;
        Particles.burst(this.x, this.y, 3, { speed: 90, color: this.glow, life: 0.2, size: 2.5, kind: 'spark' });
        if (this.hp <= 0) this.die(game);
      },
      onSwept(pulse, game) { this.marked = Math.max(this.marked, CFG.player.markTime); if (game.player.stats.echoDamage) this.takeDamage(game.player.stats.echoDamage, 0, 0, game); },

      die(game) {

        game.echoDisabled = false;
        for (let i = 0; i < 5; i++) setTimeoutBurst(this, i);
        Particles.burst(this.x, this.y, 60, { speed: 360, color: this.glow, life: 1.2, size: 4, kind: 'spark' });
        Particles.ring(this.x, this.y, { color: this.glow, size: this.r, life: 0.9 });
        game.camera.addTrauma(0.9); game.hitStop(0.1); game.triggerSlowmo(0.9);

      },

      update(dt, game) {
        const p = game.player;
        this.moveT += dt;
        if (this.hitFlash > 0) this.hitFlash -= dt;
        if (this.marked > 0) this.marked -= dt;
        if (this.invuln > 0) this.invuln -= dt;
        this.facing = Math.atan2(p.y - this.y, p.x - this.x);
        // echo-resonance marking from pulses
        const sw = RE.Echo.pulseSweeping(this.x, this.y, this.r);
        if (sw && this._pingedBy !== sw.id) { this._pingedBy = sw.id; this.onSwept(sw, game); }

        // phase transition
        const frac = this.hp / this.maxHp;
        while (this.phaseIndex < def.phases.length - 1 && frac <= def.phases[this.phaseIndex + 1].threshold) {
          this.phaseIndex++; this.phase = def.phases[this.phaseIndex];

          this.tele.t += dt;

        for (let i = this.rings.length - 1; i >= 0; i--) {
          const rg = this.rings[i];

        }

        // keep self-lit
        RE.Echo.washSoft(this.x, this.y, this.r + 40, 0.3);
      },

      _enterPhase(game) {
        RE.HUD.showBanner(this.name, this.phase.title || '', 1.6);
        RE.Audio.sfx('boss');
        game.camera.addTrauma(0.5);
        this._shockwave(game, 300, 40, 16);
        this.atkIndex = 0; this.attackCd = 1.0;
        if (this.phase.onEnter) this.phase.onEnter(this, game);
      },

      _nextAttack(game, p) {

        const atk = atks[this.atkIndex % atks.length];
        this.atkIndex++;

        // start telegraph — commit the aim NOW so the tell is honest
        const dur = atk.tell != null ? atk.tell : 0.7;
        const aimAtTell = this.facing;
        this.tele = {
          type: atk.type, t: 0, dur,
          aim: aimAtTell,
          data: atk,
          exec: (g) => this._exec(atk, g, p, aimAtTell),

      },

      _exec(atk, game, p, telAim) {
        switch (atk.type) {
          case 'radial': this._radial(game, atk.count, atk.speed, atk.dmg, atk.offset || 0); break;

          case 'spiral': this._spiral(game, atk); break;
          case 'shockwave': this._shockwave(game, atk.max || 360, atk.speed || 300, atk.dmg || 18); break;
          case 'slam': this._slam(game, telAim, atk); break;
          case 'sweep': this._sweep(game, atk, telAim); break;
          case 'gaze': this._sweep(game, atk, telAim); break;
          case 'blackout': this._blackout(game, atk); break;
          case 'supernova': this._supernova(game, atk); break;
          default: break;
        }

        game.camera.addTrauma(0.12);
      },

      _radial(game, n, speed, dmg, off) {
        dmg *= this.dmgMul;
        for (let i = 0; i < n; i++) {
          const a = off + (i / n) * TAU;
          game.spawnEnemyProjectile(this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r, Math.cos(a) * speed, Math.sin(a) * speed, dmg, this.glow);
        }
      },
      _aimed(game, aim, n, speed, dmg, spread) {
        dmg *= this.dmgMul;
        for (let i = 0; i < n; i++) {
          const a = aim + (n > 1 ? (i / (n - 1) - 0.5) * spread * 2 : 0);
          game.spawnEnemyProjectile(this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r, Math.cos(a) * speed, Math.sin(a) * speed, dmg, this.glow);

      },
      _spiral(game, atk) {
        // fire a quick burst offset by moveT to create a rotating stream
        const base = this.moveT * (atk.turn || 3);
        const dmg = (atk.dmg || 10) * this.dmgMul;
        for (let k = 0; k < (atk.arms || 3); k++) {
          const a = base + k / (atk.arms || 3) * TAU;
          game.spawnEnemyProjectile(this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r, Math.cos(a) * (atk.speed || 180), Math.sin(a) * (atk.speed || 180), dmg, this.glow);
        }
      },
      _shockwave(game, max, speed, dmg) {
        this.rings.push({ x: this.x, y: this.y, r: this.r, pr: this.r, max, speed, dmg: dmg * this.dmgMul, band: 26, hit: false });
        Particles.ring(this.x, this.y, { color: this.glow, size: this.r, life: 0.5 });
        game.camera.addTrauma(0.15);
      },
      _slam(game, aim, atk) {
        // lunge toward the telegraphed spot then shockwave
        const dist = atk.dist || 200;
        this.x += Math.cos(aim) * dist * 0.5; this.y += Math.sin(aim) * dist * 0.5;
        const res = game.map.collideCircle(this.x, this.y, this.r); this.x = res.x; this.y = res.y;
        this._shockwave(game, atk.max || 300, atk.speed || 320, atk.dmg || 20);
      },
      _sweep(game, atk, telAim) {
        // spawn a rotating beam; start at the telegraphed angle with a short
        // grace (tick 0.2) so it never hits on its first frame.
        game.bossBeams = game.bossBeams || [];
        game.bossBeams.push({ boss: this, x: this.x, y: this.y, angle: telAim != null ? telAim : this.facing, len: atk.len || 320, arc: atk.arc || 0.32, rot: atk.rot || 1.0, life: atk.dur || 3, t: 0, dmg: (atk.dmg || 8) * this.dmgMul, color: this.glow, tick: 0.2 });
      },
      _blackout(game, atk) {

        game.player.energy = Math.min(game.player.energy, atk.drainTo != null ? atk.drainTo : game.player.energy);
        RE.HUD.showBanner('SIGHT STOLEN', '', 1.4);
        RE.Audio.sfx('boss');
      },
      _supernova(game, atk) {
        // arena fills with light-death except a safe zone hugging the boss
        this._shockwave(game, 900, 380, atk.dmg || 26);
        this._radial(game, 24, 200, 12, this.moveT);
        RE.HUD.showBanner('SUPERNOVA', 'get close', 1.6);
        game.camera.addTrauma(0.8);
      },

      visibility() { return 1; },

      render(ctx, cam, echo, player) {
        // shockwaves
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (const rg of this.rings) {
          const t = rg.r / rg.max;
          ctx.strokeStyle = RE.M.rgba(this.glow, (1 - t) * 0.7);
          ctx.lineWidth = rg.band * 0.7 * (1 - t) + 2;

        }

        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, this.r * 0.42 * corePulse, 0, TAU); ctx.fill();

      hull: CFG.player.hullMax, hullMax: CFG.player.hullMax,
      energy: CFG.player.energyMax, energyMax: CFG.player.energyMax,
      energyDelay: 0,
      lightInner: CFG.player.lightInner, lightOuter: CFG.player.lightOuter,
      dashing: false, dashTimer: 0, dashCd: 0, dashDirX: 1, dashDirY: 0, dashSpeed: 0,
      iframes: 0, hitFlash: 0,
      fireTimer: 0, sinceFire: 99,
      echoCd: 0, sincePulse: 99,
      surgeCharge: 0, weaponCharge: 0, charging: false,
      shieldActive: false, shieldAngle: 0,
      barrierTimer: 0,
      bulwarkShield: 0, bulwarkTimer: 0,
      thruster: 0, walkCycle: 0,
      modules: { weapon: null, mobility: null, utility: null, defense: null },

      _blink(game, ang, dist) {

        Particles.burst(this.x, this.y, 12, { speed: 200, color: '#b6f', life: 0.4, size: 3, kind: 'spark' });

      _endDash(game) {

      _microPulse(game) {

      // ---- Update ------------------------------------------------------
      update(dt, game) {

        if (this.retaliateCd > 0) this.retaliateCd -= dt;
        if (this.energyFlash > 0) this.energyFlash -= dt;

          this.shieldActive = true;
          this.spend(10 * dt);
          this.shieldAngle = this.facing;
        }

        // Fire (charge weapons handled on release).
        const w = this.weaponDef();
        if (w.charge) {
          if (RE.Input.mouse.down) { this.charging = true; this.weaponCharge = Math.min(w.charge, this.weaponCharge + dt); }
          else if (this.charging) { this._releaseCharge(game); }
        } else if (RE.Input.mouse.down && !this.shieldActive) {
          this.fire(game);
        }

        // Energy regen (Momentum Cells override).
        const moving = Math.hypot(this.vx, this.vy) > this.stats.momentumSpeed;
        if (this.stats.momentumRegen && moving) {
          this.energy = Math.min(this.energyMax, this.energy + (CFG.player.energyRegen + this.stats.momentumBonus) * dt);
        } else if (this.energyDelay <= 0 && this.energy < this.energyMax) {
          const regen = (CFG.player.energyRegen + this.stats.energyRegenAdd) * this.stats.energyRegenMul * (game.biomeMod.energyRegenMul || 1);
          this.energy = Math.min(this.energyMax, this.energy + regen * dt);
        }

        // Low-power heartbeat warning.
        if (this.energy / this.energyMax < 0.16) {
          this._heartbeat = (this._heartbeat || 0) - dt;
          if (this._heartbeat <= 0) { this._heartbeat = 1.1; RE.Audio.sfx('lowpower'); }
        } else this._heartbeat = 0;

        // Movement (move-toward).
        if (this.dashing) {
          this.dashTimer -= dt;
          this.vx = this.dashDirX * this.dashSpeed;
          this.vy = this.dashDirY * this.dashSpeed;
          if (this.dashTimer <= 0) this._endDash(game);
          if (Math.random() < 0.6) Particles.emit({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.22, size: 5, color: '#6cf', drag: 3, kind: 'dot' });
        } else {
          const mv = RE.Input.moveVector();
          const speedMul = this.stats.speedMul * (game.biomeMod.speedMul || 1);
          const maxSpd = CFG.player.maxSpeed * speedMul;
          const tvx = mv.x * maxSpd, tvy = mv.y * maxSpd;
          const decel = CFG.player.decel * (game.biomeMod.decelMul || 1);   // ice slides
          const rate = (mv.len > 0.05 ? CFG.player.accel : decel) * dt;
          this.vx = M.approach(this.vx, tvx, rate);
          this.vy = M.approach(this.vy, tvy, rate);
          if (mv.len > 0.05) { this.moveAngle = Math.atan2(mv.y, mv.x); this.walkCycle += dt * 12; }
          // biome push (currents)
          if (game.biomeMod.push) { this.vx += game.biomeMod.push.x * dt; this.vy += game.biomeMod.push.y * dt; }
        }

        // Integrate + collide (per-axis for wall-slide).
        const preVx = this.vx, preVy = this.vy;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        const res = game.map.collideCircle(this.x, this.y, this.radius);
        this.x = res.x; this.y = res.y;
        if (res.hitX) this.vx = 0;
        if (res.hitY) this.vy = 0;
        // wall-slam trauma post-dash
        if ((res.hitX || res.hitY) && Math.hypot(preVx, preVy) > 500) game.camera.addTrauma(0.2);

        this.speed = Math.hypot(this.vx, this.vy);
        this.thruster = M.clamp(this.speed / CFG.player.maxSpeed, 0, 1);

        // Biome: overheat when idling too long (The Core Marrow).
        this.overheating = false;
        if (game.biomeMod.overheat && !this.dashing) {
          if (this.speed < 16) this._stillT = (this._stillT || 0) + dt; else this._stillT = 0;
          if (this._stillT > 2.5) {
            this.overheating = true;
            if (Math.random() < 0.3) Particles.emit({ x: this.x + (Math.random() - 0.5) * 18, y: this.y - 8, vx: 0, vy: -46, life: 0.5, size: 3, color: '#ff6a2a', drag: 1, kind: 'dot' });
            // i-frames (dash, and the reboot grace) protect against overheat —
            // prevents an undodgeable death-loop after Emergency Reboot.
            if (this.iframes <= 0) {
              const rate = 1.5 * (1 + (this._stillT - 2.5) * 0.35);
              this.hull -= rate * dt;
              if (this.hull <= 0) { this.hull = 0; this.die(game); }
            }
          }
        } else this._stillT = 0;
      },

      render(ctx, cam) {
        const sx = this.x - cam.x, sy = this.y - cam.y;
        ctx.save();
        ctx.translate(sx, sy);

        // Passive light halo.
        ctx.globalCompositeOperation = 'lighter';
        const lr = this.lightOuter;
        const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, lr);
        halo.addColorStop(0, 'rgba(120,210,255,0.14)');
        halo.addColorStop(0.5, 'rgba(80,160,255,0.05)');
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(0, 0, lr, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        // Deflector shield arc.
        if (this.shieldActive) {
          ctx.strokeStyle = 'rgba(120,200,255,0.6)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8, this.shieldAngle - 1.22, this.shieldAngle + 1.22);
          ctx.stroke();
        }
        // Bulwark bubble.
        if (this.stats.bulwark > 0 && this.bulwarkShield > 0) {
          const frac = this.bulwarkShield / this.stats.bulwark;
          ctx.strokeStyle = RE.M.rgba('#6cf', 0.25 + 0.4 * frac);
          ctx.lineWidth = 2 + 2 * frac;
          ctx.beginPath(); ctx.arc(0, 0, this.radius + 9, 0, Math.PI * 2); ctx.stroke();
        }

        // charge indicator (rail)
        const w = this.weaponDef();
        if (w.charge && this.charging) {
          const frac = M.clamp(this.weaponCharge / w.charge, 0, 1);
          ctx.strokeStyle = frac >= 1 ? '#b6f' : 'rgba(180,120,255,0.5)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(0, 0, this.radius + 12, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
        }

        // Thruster flame.
        if (this.thruster > 0.05 && !this.dashing) {
          const ta = this.moveAngle + Math.PI;
          ctx.save(); ctx.rotate(ta);
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = 'rgba(120,210,255,' + (0.4 * this.thruster) + ')';
          ctx.beginPath();
          ctx.moveTo(this.radius, 0);
          ctx.lineTo(this.radius + 10 * this.thruster, 4);
          ctx.lineTo(this.radius + 16 * this.thruster + Math.random() * 4, 0);
          ctx.lineTo(this.radius + 10 * this.thruster, -4);
          ctx.closePath(); ctx.fill();
          ctx.restore();
          ctx.globalCompositeOperation = 'source-over';
        }

        // Chassis.
        ctx.rotate(this.facing);
        const flash = this.hitFlash > 0;
        const iframeBlink = this.iframes > 0 && !this.dashing && (Math.floor(this.iframes * 30) % 2 === 0);
        ctx.globalAlpha = iframeBlink ? 0.5 : 1;
        ctx.fillStyle = flash ? '#fff' : '#2b5f7a';
        ctx.strokeStyle = '#7fe6ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flash ? '#fff' : '#0e2a38';
        ctx.fillRect(0, -3, this.radius + 8, 6);
        ctx.strokeRect(0, -3, this.radius + 8, 6);
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = flash ? '#fff' : '#8ff';
        ctx.beginPath(); ctx.arc(this.radius * 0.2, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.restore();

        // Energy ring around player (peripheral read).
        this._energyRing(ctx, sx, sy);
      },

      _energyRing(ctx, sx, sy) {
        const frac = this.energy / this.energyMax;
        const r = this.radius + 6;
        ctx.save();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(20,40,60,0.5)';
        ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
        const col = frac < 0.18 ? '#ff5a6e' : (this.energyFlash > 0 ? '#ff5a6e' : '#2db6ff');
        ctx.strokeStyle = col;
        ctx.beginPath(); ctx.arc(sx, sy, r, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
        ctx.restore();
      },
      energyFlash: 0,
    };
    p.recompute();
    return p;
  }

  RE.makePlayer = makePlayer;
  RE.DEFAULT_WEAPON = DEFAULT_WEAPON;
})(window.RE = window.RE || {});
  </script>
